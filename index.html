<style>
  :root{
    /* ---- Ink: a dark stage with two accents that mean something ----
       Flutter sky = information (links, focus, numbers); Swift ember = action (buttons, highlights). */
    --base:#07090E;                              /* ground the glow sits on   */
    --bg:transparent;                            /* sections show the glow    */
    --bg-alt:rgba(255,255,255,.045);
    --band:rgba(255,255,255,.022);               /* faint section bands       */
    --surface:rgba(255,255,255,.045);            /* glass cards               */
    --surface-solid:#0F131C;                     /* modal                     */
    --surface-2:rgba(255,255,255,.10);           /* progress track            */
    --border:rgba(255,255,255,.11);
    --border-soft:rgba(255,255,255,.065);
    --sheen:inset 0 1px 0 rgba(255,255,255,.07); /* specular top edge         */
    --blur:saturate(160%) blur(22px);
    --blur-strong:saturate(180%) blur(30px);

    --text:#F3EFE8;                              /* warm white                */
    --text-dim:#BDB9B2;
    --text-faint:#8F8D89;
    --accent:#4CC2FF;               /* Flutter sky: links, focus, numerals */
    --accent-ink:#7AD3FF;           /* small text on dark — passes AA      */
    --accent-dim:rgba(76,194,255,.14);
    --accent-2:#FF7A45;             /* Swift ember: action and highlight   */
    --signal:#FF7A45;

    --card:0 6px 22px rgba(0,0,0,.28);
    --glow:0 14px 38px rgba(0,0,0,.42);
    --glow-strong:0 22px 54px rgba(0,0,0,.55);
    /* radius scale — larger surfaces get larger corners, as on iOS */
    --r-xs:6px;     /* chips, tags, badges        */
    --r-sm:12px;    /* icon tiles, float tags     */
    --r-md:14px;    /* buttons, stat & app tiles  */
    --r-lg:18px;    /* content cards              */
    --r-xl:24px;    /* modal                      */
    --r-pill:999px; /* pills and bars             */
    --font-display:'Bricolage Grotesque','Helvetica Neue',sans-serif;
    --font-body:'Inter','Helvetica Neue',Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }

  *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  body{
    background:var(--base);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  section{ position:relative; }
  ::selection{ background:var(--accent-dim); color:var(--accent); }

  /* ---------- ambient background ---------- */
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-glow::before, .bg-glow::after{ content:''; position:absolute; }
  /* the colour blobs: a little oversized so they can drift, positions converted so they sit exactly where they did */
  .bg-glow::before{
    inset:-10% -6%; will-change:transform;
    background:
      radial-gradient(ellipse 52% 40% at 78% 14%, rgba(76,194,255,.16), transparent 62%),
      radial-gradient(ellipse 46% 38% at 12% 22%, rgba(255,122,69,.11), transparent 62%),
      radial-gradient(ellipse 50% 40% at 70% 72%, rgba(76,120,255,.12), transparent 60%),
      radial-gradient(ellipse 44% 34% at 16% 80%, rgba(255,122,69,.08), transparent 60%);
  }
  /* scrim keeps the ground dark and quiet so text always has contrast; a fine dot grid adds depth */
  .bg-glow::after{
    inset:0;
    background:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px) 0 0/34px 34px, rgba(7,9,14,.5);
  }

  .bracket-corner{
    position:absolute; width:18px; height:18px;
    border:2px solid var(--accent); opacity:.8;
    transition:width .3s ease, height .3s ease, opacity .3s ease;
  }
  .bracket-corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
  .bracket-corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
  .bracket-corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; border-radius:0 0 0 4px; }
  .bracket-corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; border-radius:0 0 4px 0; }

  /* ---------- nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(7,9,14,.6);
    -webkit-backdrop-filter:var(--blur-strong); backdrop-filter:var(--blur-strong);
    border-bottom:1px solid var(--border-soft);
  }
  nav{
    max-width:1180px; margin:0 auto; padding:22px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:var(--font-display); font-size:18px; font-weight:600;
    display:flex; align-items:center; gap:9px; letter-spacing:.005em;
  }
  .logo .dot{ width:8px; height:8px; background:var(--accent); border-radius:2px; flex-shrink:0; }
  .nav-links{ display:flex; gap:34px; }
  .nav-links a{
    font-size:15px; color:var(--text-dim); font-weight:500;
    position:relative; padding-bottom:4px; transition:color .25s ease;
  }
  .nav-links a:hover{ color:var(--text); }
  .nav-links a::after{
    content:''; position:absolute; bottom:0; left:0; width:0; height:1px;
    background:var(--accent); transition:width .25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  .nav-cta{
    font-family:var(--font-mono); font-size:12.5px; font-weight:500;
    color:#1A0B05; background:linear-gradient(120deg,#FF9460,#FF6A3D);
    padding:11px 20px; border-radius:var(--r-md); letter-spacing:.01em;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .nav-cta:hover{ transform:translateY(-1px); box-shadow:var(--glow); }
  .nav-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px; }
  .nav-toggle span{ width:22px; height:2px; background:var(--text); display:block; border-radius:2px; }

  /* ---------- hero ---------- */
  .hero{ padding:128px 0 76px; position:relative; z-index:1; }
  .hero-grid{ display:grid; grid-template-columns:1.04fr .96fr; gap:40px; align-items:center; }
  .status-pill{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:12px; color:var(--accent);
    border:1px solid rgba(76,194,255,.22); background:var(--accent-dim);
    box-shadow:var(--sheen);
    padding:8px 16px; border-radius:var(--r-pill); letter-spacing:.03em;
  }
  .hero-id{ display:flex; align-items:center; gap:18px; margin-bottom:26px; flex-wrap:wrap; }
  .status-pill .pulse{
    width:6px; height:6px; background:var(--accent); border-radius:50%;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.28; } }

  /* the role line is the first thing a client reads about what he does, so it carries the ember highlight */
  .eyebrow{
    display:inline-block; max-width:100%;
    font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--text);
    letter-spacing:.08em; text-transform:uppercase; line-height:1.55; margin-bottom:20px;
    padding:9px 18px 9px 15px; border-left:3px solid var(--accent-2); border-radius:0 12px 12px 0;
    background:linear-gradient(90deg, rgba(255,122,69,.22), rgba(255,122,69,.05) 80%, rgba(255,122,69,0));
  }
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(42px, 5.4vw, 66px); line-height:1.04; letter-spacing:-.025em;
    margin-bottom:22px; text-wrap:balance;
  }
  h1 .accent{
    background:linear-gradient(120deg, var(--accent) 10%, var(--accent-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-lede{ font-size:18px; line-height:1.65; color:var(--text-dim); max-width:545px; margin-bottom:34px; }
  .hero-lede strong{ color:var(--text); font-weight:600; }
  .hero-ctas{ display:flex; gap:14px; margin-bottom:42px; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-mono); font-size:13px; font-weight:500;
    padding:15px 26px; border-radius:var(--r-md); letter-spacing:.01em;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn-primary{ background:linear-gradient(120deg,#FF9460,#FF6A3D); color:#1A0B05; font-weight:600; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--glow-strong); }
  .btn-ghost{
    border:1px solid var(--border); color:var(--text); background:var(--surface);
    box-shadow:var(--sheen), var(--card);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:var(--glow); }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    box-shadow:var(--sheen), var(--card);
    padding:20px 18px;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .stat:hover{ transform:translateY(-3px); box-shadow:var(--glow); border-color:rgba(76,194,255,.45); }
  .stat-num{ font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--accent); letter-spacing:-.02em; }
  .stat-label{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }

  /* ---------- hero: the pair of phones. The 3D scene draws over this; until it has, and if it cannot, the flat duo shows. ---------- */
  .hero-visual{ display:flex; align-items:center; justify-content:center; position:relative; padding:14px 0; }
  .tilt{ display:flex; }
  .duo-fallback{ display:flex; align-items:center; }
  .fb-duo{
    position:relative; width:clamp(280px,40vw,470px); aspect-ratio:1536/1074; border-radius:clamp(14px,2vw,22px); overflow:hidden;
    border:clamp(4px,.6vw,7px) solid #2a2d36; background:#000; box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .fb-duo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fb-duo::after{ content:''; position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px; background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.1),rgba(0,0,0,.5)); }

  .float-tag{
    position:absolute; font-family:var(--font-mono); font-size:11px; z-index:7;
    color:var(--text-dim); background:var(--surface);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:7px 11px; letter-spacing:.04em;
    box-shadow:var(--sheen), var(--card);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .float-tag::before{ content:''; position:absolute; width:8px; height:8px; border-left:1px solid var(--accent-2); border-top:1px solid var(--accent-2); top:-1px; left:-1px; }
  /* positioned against .hero-visual (outside the 3D subtree) so they always
     paint above the folded leaf */
  .ft-1{ top:3%; right:1%; }
  .ft-2{ top:43%; left:0; }
  .ft-3{ bottom:5%; right:3%; }

  /* ----- the stage: one fixed three.js canvas behind the page. The phones travel between three
     anchors (hero, work, contact) that are plain boxes in the layout, so the scene stays responsive for free.
     Until WebGL has drawn, nothing changes: the flat duo in the hero is the fallback. ----- */
  .hero-visual{ min-height:440px; }
  #stage3d{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:0; transition:opacity 1s ease; }
  html.stage-on #stage3d{ opacity:1; }
  .hero-visual.gl-on .tilt{ opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s .6s; }
  .hero-visual.gl-on .float-tag{ display:none; }
  .work-stage, .contact-stage{ display:none; }
  html.stage-on .contact-stage{ display:block; height:330px; margin:0 auto 8px; }
  html.stage-on .hero-visual, html.stage-on .work-stage, html.stage-on .contact-stage{ cursor:grab; touch-action:pan-y; }
  /* desktop: the project list scrolls on the left while the phone stays put on the right */
  @media (min-width:961px){
    html.stage-on .work{ display:grid; grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr); gap:56px; align-items:start; }
    html.stage-on .work .proj-grid{ flex-direction:column; flex-wrap:nowrap; justify-content:flex-start; gap:18px; }
    html.stage-on .work .proj-grid{ padding-bottom:34vh; }   /* keeps the phone pinned until the last project has passed */
    html.stage-on .work .proj-card{ flex:none; flex-direction:row; }
    html.stage-on .work .proj-visual{ width:128px; height:auto; flex-shrink:0; border-bottom:none; border-right:1px solid var(--border); }
    html.stage-on .work .proj-body{ padding:20px 22px; }
    html.stage-on .work .proj-body p{ margin-bottom:14px; }
    html.stage-on .work-stage{ display:block; position:sticky; top:max(96px, calc(50vh - 270px)); height:540px; }
  }
  .proj-card.is-active{ border-color:var(--accent); box-shadow:var(--sheen), 0 0 0 1px rgba(76,194,255,.35), var(--glow); }
  @media (max-width:680px){ html.stage-on .contact-stage{ height:260px; } }

  /* ---------- flagship band ---------- */
  #track{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:46px 0; position:relative; z-index:1; }
  .track-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:30px; }
  .track-left{ display:flex; align-items:flex-start; gap:13px; }
  .track-badge{
    font-family:var(--font-mono); font-size:10px; color:#1A0B05; background:var(--signal);
    padding:5px 9px; border-radius:var(--r-xs); letter-spacing:.09em; font-weight:500; margin-top:3px; white-space:nowrap;
  }
  .track-title{ font-family:var(--font-display); font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .track-sub{ font-size:13.5px; color:var(--text-faint); margin-top:3px; max-width:340px; line-height:1.5; }
  .track-stats{ display:flex; gap:40px; flex-wrap:wrap; }
  .track-stat .tnum{ font-family:var(--font-display); font-size:25px; font-weight:700; color:var(--accent); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .track-stat .tlabel{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:3px; letter-spacing:.06em; }
  .track-link{
    font-family:var(--font-mono); font-size:12.5px; color:var(--text);
    border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--sheen), var(--card); padding:11px 20px; white-space:nowrap;
    transition:border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .track-link:hover{ border-color:var(--accent); color:var(--accent); box-shadow:var(--glow); }
  @media (max-width:900px){ .track-row{ flex-direction:column; align-items:flex-start; } }

  /* ---------- services ---------- */
  .svc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .svc-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    padding:26px 22px; display:flex; flex-direction:column;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .svc-card:hover{ transform:translateY(-4px); box-shadow:var(--glow); border-color:rgba(76,194,255,.40); }
  .svc-icon{
    width:42px; height:42px; margin-bottom:16px; border:1px solid var(--border); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center; background:var(--bg-alt); flex-shrink:0;
  }
  .svc-icon svg{ width:21px; height:21px; }
  .svc-card h3{ font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:11px; letter-spacing:-.015em; }
  .svc-card p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:15px; flex:1; }
  .svc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .svc-chips span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); border:1px solid var(--border-soft); border-radius:var(--r-xs); padding:3px 9px; }
  .svc-note{
    margin-top:34px; padding:18px 22px; border:1px solid var(--border); border-radius:var(--r-lg);
    background:var(--surface); font-size:14.5px; line-height:1.65; color:var(--text-dim);
  }
  .svc-note strong{ color:var(--text); font-weight:600; }

  /* ---------- section headers ---------- */
  .section-pad{ padding:78px 0; position:relative; z-index:1; }
  .sec-head{ max-width:680px; margin-bottom:42px; }
  .sec-eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-ink);
    letter-spacing:.15em; text-transform:uppercase; margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .sec-eyebrow::before{ content:''; width:24px; height:1px; background:var(--accent); flex-shrink:0; }
  .sec-head h2{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(30px,3.4vw,42px); line-height:1.14; letter-spacing:-.022em; margin-bottom:15px; text-wrap:balance;
  }
  .sec-head p{ color:var(--text-dim); font-size:16.5px; line-height:1.62; }

  .reveal{ opacity:1; transform:none; transition:opacity .7s ease, transform .7s ease; }
  .reveal.pending{ opacity:0; transform:translateY(22px); }

  /* ---------- skills ---------- */
  #skills{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  /* fifteen groups of very different lengths: each card is as tall as its chips, and JS drops every card into whichever column is
     currently shortest, so the columns finish at nearly the same height and no card trails off into empty space */
  .skill-grid{ display:flex; gap:16px; align-items:flex-start; margin-bottom:48px; }
  .skill-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:16px; }
  .skill-card{
    --tint:rgba(76,194,255,.10);
    position:relative; padding:24px 24px 26px;
    background:radial-gradient(130% 120px at 0 0, var(--tint), transparent 70%), var(--surface);
    border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .skill-card:hover{ transform:translateY(-3px); box-shadow:var(--glow); border-color:rgba(76,194,255,.40); }
  .skill-head{ display:flex; align-items:center; gap:13px; padding-bottom:17px; margin-bottom:17px; border-bottom:1px solid var(--border-soft); }
  .skill-ico{
    width:42px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg-alt); box-shadow:var(--sheen);
  }
  .skill-ico svg{ width:21px; height:21px; }
  .skill-head h3{ font-family:var(--font-display); font-size:17.5px; font-weight:600; line-height:1.25; letter-spacing:-.012em; }
  .skill-head .idx{ margin-left:auto; align-self:flex-start; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--accent-2); }
  .skill-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  /* equal-height cards: the footer sits on the bottom edge, so a short list ends tidily instead of trailing off */
  .skill-card{ display:flex; flex-direction:column; }
  .skill-foot{
    margin-top:auto; padding-top:13px; border-top:1px solid var(--border-soft);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);
  }
  .skill-chips li{
    font-family:var(--font-mono); font-size:12.5px; line-height:1.2; color:var(--text-dim);
    padding:7px 12px; border:1px solid var(--border); border-radius:var(--r-pill); background:rgba(255,255,255,.06);
    transition:border-color .2s ease, color .2s ease, background .2s ease, transform .2s ease;
  }
  .skill-chips li:hover{ border-color:rgba(76,194,255,.5); color:var(--accent-ink); background:rgba(76,194,255,.1); transform:translateY(-1px); }

  .expertise{ display:grid; grid-template-columns:1fr 1fr; gap:34px 54px; }
  .bar-item .bar-top{ display:flex; justify-content:space-between; gap:16px; font-size:14.5px; margin-bottom:9px; }
  .bar-item .bar-top .bname{ font-weight:500; }
  .bar-item .bar-top .bpct{ font-family:var(--font-mono); color:var(--accent-ink); font-variant-numeric:tabular-nums; }
  .bar-track{ height:6px; background:var(--surface-2); border-radius:var(--r-pill); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .bar-sub{ font-size:12.5px; color:var(--text-faint); margin-top:8px; }
  .expertise-note{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:24px; letter-spacing:.02em; }

  /* ---------- experience timeline ---------- */
  .timeline{
    position:relative; padding-left:34px; border-left:1px solid var(--border);
    --tl-dot:9px;        /* dot diameter */
    --tl-role-line:32px; /* line box of .tl-role — the dot centres on this */
  }
  .tl-item{ position:relative; padding-bottom:38px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{
    content:''; position:absolute; left:-39px;
    width:var(--tl-dot); height:var(--tl-dot);
    /* centre the dot on the first line of the role title, not the item's top edge */
    top:calc((var(--tl-role-line) - var(--tl-dot)) / 2);
    background:var(--base); border:2px solid var(--accent); border-radius:50%;
  }
  .tl-item.is-education::before{ border-color:var(--accent-2); }
  .tl-head{ display:flex; align-items:baseline; gap:13px; flex-wrap:wrap; margin-bottom:7px; }
  .tl-role{ font-family:var(--font-display); font-size:20px; line-height:var(--tl-role-line); font-weight:600; letter-spacing:-.015em; }
  .tl-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); letter-spacing:.05em; }
  .tl-org{ font-size:14.5px; color:var(--accent-2); margin-bottom:11px; font-weight:500; }
  .tl-item.is-education .tl-org{ margin-bottom:0; }
  .tl-desc{ color:var(--text-dim); font-size:15.5px; line-height:1.66; max-width:700px; margin-bottom:13px; }
  .tl-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tl-tags span{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:var(--r-xs); padding:4px 10px;
  }

  /* ---------- certifications ---------- */
  /* Reads as the tail of the experience timeline above it: #experience already
     leaves 78px of bottom padding, so this section drops its own top padding. */
  #certifications{ padding-top:0; }
  .cert-list{ display:flex; flex-direction:column; gap:20px; }
  .cert-card{
    display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); overflow:hidden;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
  }
  .cert-card:hover .bracket-corner{ width:24px; height:24px; opacity:1; }
  .cert-visual{
    position:relative; display:flex; align-items:center; justify-content:center;
    padding:38px 36px; border-right:1px solid var(--border);
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(76,194,255,.05), transparent 70%);
  }
  .cert-preview{
    display:flex; flex-direction:column; align-items:center; gap:16px; width:100%;
    background:none; border:none; padding:0; color:inherit; cursor:zoom-in; border-radius:var(--r-md);
  }
  /* drop-shadow (not box-shadow) so it follows the PNG's rounded, transparent corners */
  .cert-preview img{
    width:100%; height:auto; filter:drop-shadow(0 10px 22px rgba(0,0,0,.36));
    transition:transform .3s ease, filter .3s ease;
  }
  .cert-preview:hover img{ transform:translateY(-3px); filter:drop-shadow(0 16px 30px rgba(0,0,0,.42)); }
  .cert-hint{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono);
    font-size:11px; color:var(--text-faint); letter-spacing:.05em; transition:color .25s ease;
  }
  .cert-hint svg{ width:12px; height:12px; flex-shrink:0; }
  .cert-preview:hover .cert-hint{ color:var(--accent-ink); }
  .cert-body{ padding:38px 38px 38px 40px; display:flex; flex-direction:column; justify-content:center; }
  .cert-issuer{ font-family:var(--font-mono); font-size:11px; color:var(--accent-ink); letter-spacing:.07em; margin-bottom:10px; text-transform:uppercase; }
  .cert-body h3{ font-family:var(--font-display); font-size:27px; font-weight:600; line-height:1.18; letter-spacing:-.02em; margin-bottom:12px; }
  .cert-desc{ font-size:15.5px; line-height:1.66; color:var(--text-dim); margin-bottom:22px; }
  .cert-facts{ border-top:1px solid var(--border-soft); margin-bottom:26px; }
  .cert-fact{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:12px 0; border-bottom:1px solid var(--border-soft); }
  .cert-fact dt{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:.07em; text-transform:uppercase; }
  .cert-fact dd{ font-family:var(--font-mono); font-size:13px; color:var(--text); letter-spacing:.02em; text-align:right; }
  .cert-body .btn{ align-self:flex-start; }

  /* full-size view — native <dialog>, so Escape, focus trap and focus return come free */
  .lightbox{ max-width:none; max-height:none; margin:auto; padding:0; border:none; background:none; overflow:visible; }
  .lightbox::backdrop{ background:rgba(0,0,0,.7); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .lightbox img{
    display:block; width:auto; height:auto;
    max-width:min(1492px, calc(100vw - 48px));
    max-height:calc(100vh - 48px); max-height:calc(100dvh - 48px);
    filter:drop-shadow(0 20px 48px rgba(0,0,0,.35));
  }
  .lightbox .modal-close{ top:-14px; right:-14px; }

  /* ---------- projects ---------- */
  #projects{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  /* flex, not grid: an incomplete final row centres instead of stranding a card */
  .proj-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
  .proj-card{
    flex:0 1 calc((100% - 40px) / 3);
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); overflow:hidden; text-align:left; width:100%; color:inherit;
    box-shadow:var(--sheen), var(--card);
    cursor:pointer; transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    display:flex; flex-direction:column;
  }
  .proj-card:hover{ transform:translateY(-5px); border-color:rgba(76,194,255,.45); box-shadow:var(--glow-strong); }
  .proj-card:hover .bracket-corner{ width:24px; height:24px; opacity:1; }
  .proj-visual{
    height:152px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--border);
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(76,194,255,.05), transparent 70%);
  }
  .proj-visual svg{ width:50px; height:50px; position:relative; z-index:2; }
  .icon-stroke{ stroke:var(--accent); fill:none; }
  .icon-stroke-2{ stroke:var(--accent-2); fill:none; }
  .proj-num{
    position:absolute; top:10px; right:14px; font-family:var(--font-mono);
    font-size:10.5px; color:var(--text-faint); z-index:2; letter-spacing:.05em;
  }
  .proj-body{ padding:22px; flex:1; display:flex; flex-direction:column; }
  .proj-cat{ font-family:var(--font-mono); font-size:11px; color:var(--accent-ink); letter-spacing:.07em; margin-bottom:9px; text-transform:uppercase; }
  .proj-body h3{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:10px; letter-spacing:-.015em; }
  .proj-body p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:17px; flex:1; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .proj-tags span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); border:1px solid var(--border); border-radius:var(--r-xs); padding:4px 9px; }
  .proj-more-link{ text-align:center; margin-top:34px; }
  .proj-more-link a{ font-family:var(--font-mono); font-size:13px; color:var(--accent-ink); border-bottom:1px solid transparent; transition:border-color .25s ease; }
  .proj-more-link a:hover{ border-color:var(--accent); }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.7);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    z-index:1000; display:none; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--surface-solid); border:1px solid var(--border); max-width:620px; width:100%;
    -webkit-backdrop-filter:var(--blur-strong); backdrop-filter:var(--blur-strong);
    max-height:86vh; overflow-y:auto; position:relative; border-radius:var(--r-xl); box-shadow:var(--glow-strong);
  }
  .modal-media{ height:210px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--border); position:relative; }
  .modal-media iframe{ width:100%; height:100%; border:none; display:block; }
  .modal-media svg{ width:66px; height:66px; }
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:34px; height:34px; background:rgba(255,255,255,.12); border:1px solid var(--border); border-radius:50%;
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;
    transition:border-color .25s ease, color .25s ease;
  }
  .modal-close:hover{ border-color:var(--signal); color:var(--signal); }
  .modal-content{ padding:28px; }
  .modal-content h3{ font-family:var(--font-display); font-size:25px; margin-bottom:7px; letter-spacing:-.02em; }
  .modal-role{ font-size:13.5px; color:var(--accent-2); margin-bottom:15px; font-weight:500; }
  .modal-content p{ font-size:15.5px; line-height:1.66; color:var(--text-dim); margin-bottom:17px; }
  /* a project can list several stores, so the row wraps instead of running off the box */
  #modalLinkWrap{ display:flex; flex-wrap:wrap; gap:9px 20px; margin-bottom:17px; }
  .modal-link{ font-family:var(--font-mono); font-size:12.5px; color:var(--accent-ink); border-bottom:1px solid transparent; }
  .modal-link:hover{ border-color:var(--accent); }

  /* ---------- shipped apps ---------- */
  .app-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .app-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    box-shadow:var(--sheen), var(--card);
    padding:20px 18px; display:flex; align-items:center; gap:14px; color:inherit;
  }
  a.app-tile{ transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease; }
  a.app-tile:hover{ transform:translateY(-4px); border-color:rgba(255,122,69,.42); box-shadow:var(--glow); }
  .app-meta{ display:flex; align-items:center; gap:9px; margin-top:5px; flex-wrap:wrap; }
  .app-rating{ font-family:var(--font-mono); font-size:10.5px; color:var(--signal); }
  .app-store{ font-family:var(--font-mono); font-size:10px; color:var(--accent-ink); letter-spacing:.05em; }
  .app-icon{
    width:44px; height:44px; flex-shrink:0; border:1px solid var(--border); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center; background:var(--bg-alt);
  }
  .app-icon svg{ width:22px; height:22px; }
  .app-tile h3{ font-family:var(--font-display); font-size:14.5px; font-weight:600; line-height:1.3; letter-spacing:-.01em; }
  .app-genre{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; }
  .app-dev-link{ text-align:center; margin-top:28px; }
  .app-dev-link a{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); border-bottom:1px solid var(--border); transition:color .25s ease, border-color .25s ease; }
  .app-dev-link a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------- process ---------- */
  #process{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  .process-list{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .proc-item{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    padding:28px 22px;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .proc-item:hover{ transform:translateY(-4px); box-shadow:var(--glow); border-color:rgba(76,194,255,.40); }
  .proc-num{ font-family:var(--font-mono); font-size:11.5px; color:var(--signal); margin-bottom:18px; letter-spacing:.07em; }
  .proc-item h3{ font-family:var(--font-display); font-size:18.5px; font-weight:600; margin-bottom:12px; letter-spacing:-.015em; }
  .proc-item p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:15px; }
  .proc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .proc-chips span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); border:1px solid var(--border-soft); border-radius:var(--r-xs); padding:3px 9px; }

  /* ---------- ai workflow ---------- */
  .ai-grid{ display:grid; grid-template-columns:1.02fr .98fr; gap:14px; align-items:start; }
  .ai-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card); padding:26px 24px;
  }
  .ai-card + .ai-card{ margin-top:14px; }
  .ai-card h3{
    font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.01em;
    margin-bottom:16px; display:flex; align-items:baseline; gap:10px;
  }
  .ai-card h3 .ai-kicker{ font-family:var(--font-mono); font-size:11px; font-weight:400; color:var(--accent-2); letter-spacing:.07em; }
  .ai-uses li{
    display:flex; gap:11px; align-items:flex-start;
    font-size:14.5px; line-height:1.55; color:var(--text-dim);
    padding:9px 0; border-top:1px solid var(--border-soft);
  }
  .ai-uses li:first-child{ border-top:none; }
  .ai-uses li svg{ width:15px; height:15px; flex-shrink:0; margin-top:3px; }
  .ai-focus{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ai-focus div{
    display:flex; align-items:center; gap:10px; padding:11px 13px;
    border:1px solid var(--border-soft); border-radius:var(--r-md); background:rgba(255,255,255,.04);
    font-size:13.5px; line-height:1.35;
  }
  .ai-focus div svg{ width:20px; height:20px; flex-shrink:0; }
  .ai-tool-row{ display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; padding:11px 0; border-top:1px solid var(--border-soft); }
  .ai-tool-row:first-of-type{ border-top:none; padding-top:0; }
  .ai-tool-row .tlabel{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.07em; padding-top:5px; min-width:62px; }
  .ai-tool-row .tchips{ display:flex; flex-wrap:wrap; gap:7px; }
  .ai-tool-row .tchips span{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:var(--r-pill); background:rgba(255,255,255,.05); padding:4px 11px;
  }
  .ai-note{
    margin-top:20px; max-width:720px; font-size:14.5px; line-height:1.62; color:var(--text-dim);
    border-left:2px solid var(--accent); padding-left:16px;
  }
  .ai-note strong{ color:var(--text); font-weight:600; }

  /* ---------- faq ---------- */
  .faq-list{ max-width:760px; }
  .faq-item{ border-bottom:1px solid var(--border-soft); }
  .faq-q{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.012em;
    padding:21px 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:20px;
  }
  .faq-q .plus{ font-family:var(--font-mono); color:var(--accent-ink); font-size:17px; transition:transform .3s ease; flex-shrink:0; }
  .faq-item.open .plus{ transform:rotate(45deg); }
  .faq-a{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .faq-a p{ padding-bottom:21px; color:var(--text-dim); font-size:15.5px; line-height:1.66; max-width:640px; }

  /* ---------- contact ---------- */
  #faq{ padding-bottom:34px; }   /* the contact section follows straight on, with the device at its top */
  #contact{ padding:34px 0 92px; text-align:center; position:relative; z-index:1; }
  #contact h2{ font-family:var(--font-display); font-weight:700; font-size:clamp(32px,4.4vw,50px); line-height:1.12; letter-spacing:-.028em; margin-bottom:18px; text-wrap:balance; }
  #contact .sub{ color:var(--text-dim); font-size:16.5px; line-height:1.6; max-width:540px; margin:0 auto 38px; }
  /* 7 chips need 1234px but only 1116px is available, so they wrap. Capping the
     row forces a balanced 4 + 3 instead of stranding one chip alone. */
  .contact-grid{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; max-width:820px; margin:0 auto; }
  .contact-chip{
    font-family:var(--font-mono); font-size:13.5px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface); box-shadow:var(--sheen), var(--card); padding:11px 20px;
    transition:border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  a.contact-chip:hover{ border-color:var(--accent); color:var(--accent); box-shadow:var(--glow); }

  footer{ border-top:1px solid var(--border-soft); padding:40px 0; position:relative; z-index:1; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .footer-brand{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint); }
  .footer-links{ display:flex; gap:24px; }
  .footer-links a{ font-size:13.5px; color:var(--text-dim); transition:color .25s ease; }
  .footer-links a:hover{ color:var(--accent); }

  /* ---------- motion ----------
     Decoration only: entrances, parallax and pointer effects sit behind prefers-reduced-motion, and the
     pointer ones also need a real hover pointer. Entrances use `backwards` fill, so once an animation
     ends the element falls back to its normal styles and the hover lifts keep working. Everything that
     moves is transform or opacity, which keeps it off the main thread. */
  :root{ --ease:cubic-bezier(.22,1,.36,1); }          /* quick start, long soft landing */
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .stat-num{ font-variant-numeric:tabular-nums; }

  /* The big frosted bands blur a background that is already soft, so the blur hardly shows, but the
     browser recomputes it on every scroll frame. Plain translucency looks the same and scrolls smoother. */
  #track, #skills, #projects, #process{ -webkit-backdrop-filter:none; backdrop-filter:none; }

  .scroll-progress{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:101; pointer-events:none;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    transform:scaleX(0); transform-origin:0 50%; will-change:transform;
  }

  /* the header tightens and lifts once you leave the top */
  header{ transition:background .35s ease, box-shadow .35s ease; }
  nav{ transition:padding .35s var(--ease); }
  header.scrolled{ background:rgba(7,9,14,.82); box-shadow:0 8px 28px rgba(0,0,0,.4); }
  header.scrolled nav{ padding-top:14px; padding-bottom:14px; }
  .nav-links a.active{ color:var(--text); }
  .nav-links a.active::after{ width:100%; }

  .hero-grid{ position:relative; z-index:1; }
  .hero-glow{
    position:absolute; left:0; top:0; width:560px; height:560px; margin:-280px 0 0 -280px;
    border-radius:50%; pointer-events:none; z-index:0; opacity:0; transition:opacity .6s ease; will-change:transform;
    background:radial-gradient(circle, rgba(76,194,255,.16), rgba(255,122,69,.08) 42%, transparent 68%);
  }
  .hero-glow.on{ opacity:1; }
  .tilt{ flex-shrink:0; will-change:transform; }

  /* buttons: they lean toward the pointer, and a sweep of light crosses the solid ones on hover */
  .btn, .nav-cta, .track-link{ transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease, translate .35s var(--ease); }
  .btn-primary, .nav-cta{ position:relative; overflow:hidden; isolation:isolate; }
  .btn-primary::after, .nav-cta::after{
    content:''; position:absolute; top:0; bottom:0; left:0; width:55%; z-index:-1; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent);
    transform:translateX(-140%) skewX(-18deg); transition:transform .8s ease;
  }
  .btn-primary:hover::after, .nav-cta:hover::after{ transform:translateX(260%) skewX(-18deg); }

  /* headings: every word rises out of its own mask; the accent words share one gradient (sized in JS) */
  .wd{ display:inline-block; overflow:hidden; vertical-align:top; padding:.1em .04em .2em; margin:-.1em -.04em -.2em; }
  .wd > span{ display:inline-block; }
  .acc > span{
    background-image:linear-gradient(120deg, var(--accent) 10%, var(--accent-2) 90%); background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sec-eyebrow::before{ transform-origin:left center; transition:transform .9s var(--ease) .15s; }
  .reveal.pending .sec-eyebrow::before{ transform:scaleX(0); }

  /* ribbon: a slow strip of the stack under the hero */
  .ribbon{
    position:relative; z-index:1; overflow:hidden; padding:17px 0;
    border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); background:rgba(255,255,255,.02);
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
  }
  .ribbon-track{ display:flex; width:max-content; }
  .ribbon-track span{
    display:inline-flex; align-items:center; gap:30px; padding-right:30px; white-space:nowrap;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint);
  }
  .ribbon-track span::after{ content:''; width:5px; height:5px; border-radius:1px; background:var(--accent); opacity:.7; transform:rotate(45deg); }

  /* the timeline fills as you read down it, and its dots light up */
  .timeline::before{
    content:''; position:absolute; left:-1px; top:0; bottom:0; width:2px; border-radius:2px;
    background:linear-gradient(var(--accent), var(--accent-2));
    transform:scaleY(var(--tl-progress, 0)); transform-origin:top;
  }
  .tl-item::before{ transition:background .4s ease, box-shadow .5s ease, transform .5s cubic-bezier(.3,1.5,.5,1); }
  .tl-item.reached::before{ background:var(--accent); box-shadow:0 0 0 5px rgba(76,194,255,.16); transform:scale(1.18); }
  .tl-item.is-education.reached::before{ background:var(--accent-2); box-shadow:0 0 0 5px rgba(255,122,69,.16); }

  @keyframes rise{ from{ opacity:0; transform:translate3d(0,34px,0) scale(.97); } }
  @keyframes wordUp{ from{ transform:translate3d(0,112%,0); } }
  @keyframes tagIn{ from{ opacity:0; transform:translateY(14px) scale(.85); } }
  @keyframes chipIn{ from{ opacity:0; transform:translate3d(0,10px,0) scale(.9); } }
  @keyframes bob{ 50%{ translate:0 -7px; } }
  @keyframes ribbon{ to{ transform:translate3d(-50%,0,0); } }
  @keyframes blobIdle{ from{ translate:0 0; rotate:0deg; } to{ translate:1.8% -1.4%; rotate:2deg; } }

  @media (prefers-reduced-motion: no-preference){
    /* hero: blocks rise in turn, the headline words climb out of their masks, tags pop */
    .hero-in .hero-grid > div:first-child > :not(.stat-row):not(h1){
      animation:rise .95s var(--ease) backwards; animation-delay:calc(var(--n, 0) * 90ms + 60ms);
    }
    .hero-in h1 .wd > span{ animation:wordUp 1.1s var(--ease) backwards; animation-delay:calc(var(--w, 0) * 55ms + 160ms); }
    .hero-in .stat{ animation:rise .9s var(--ease) backwards; animation-delay:calc(var(--n, 0) * 80ms + 640ms); }
    .ft-1{ --n:0; } .ft-2{ --n:1; } .ft-3{ --n:2; }
    .hero-in .float-tag{
      animation:tagIn .8s var(--ease) backwards, bob 6s ease-in-out infinite;
      animation-delay:calc(var(--n, 0) * 140ms + 1.2s), calc(var(--n, 0) * -2s);
    }

    /* section titles climb out of their masks as the section arrives; the heading block itself stays put */
    .wd > span{ transition:transform 1s var(--ease); transition-delay:calc(var(--w, 0) * 50ms); }
    .reveal.pending .wd > span{ transform:translate3d(0,112%,0); }
    .sec-head.reveal.pending{ transform:none; }

    /* cards land one by one as they come on screen, a few ms apart when several arrive together */
    .rv-pending{ opacity:0; }
    .rv-in{ animation:rise .9s var(--ease) backwards; animation-delay:calc(var(--d, 0) * 1ms); }
    .rv-in .skill-chips li{ animation:chipIn .6s var(--ease) backwards; animation-delay:calc(var(--d, 0) * 1ms + var(--c, 0) * 28ms + 260ms); }

    .ribbon-track{ animation:ribbon var(--ribbon-dur, 70s) linear infinite; }
    .ribbon:hover .ribbon-track{ animation-play-state:paused; }
    .bg-glow::before{ animation:blobIdle 40s ease-in-out infinite alternate; }
  }

  /* scroll-linked motion runs as CSS scroll timelines where the browser has them (off the main thread) */
  @supports (animation-timeline: scroll()){
    @keyframes grow{ to{ transform:scaleX(1); } }
    @keyframes heroDrift{ to{ transform:translate3d(0,64px,0) scale(.97); } }
    @keyframes blobScroll{ to{ transform:translate3d(-2.5%,-8%,0) scale(1.07); } }
    @media (prefers-reduced-motion: no-preference){
      .scroll-progress{ animation:grow linear both; animation-timeline:scroll(root); }
      .hero-visual{ animation:heroDrift linear both; animation-timeline:scroll(root); animation-range:0px 640px; }
      .bg-glow::before{ animation:blobScroll linear both, blobIdle 40s ease-in-out infinite alternate; animation-timeline:scroll(root), auto; }
    }
  }

  /* a soft light follows the pointer across glass cards */
  @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: no-preference){
    .lit{ position:relative; }
    .lit::before, .lit::after{
      content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      opacity:0; transition:opacity .35s ease;
    }
    .lit::before{        /* lit edge */
      padding:1px;
      background:radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(76,194,255,.75), rgba(255,122,69,.4) 45%, transparent 72%);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
      mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
    }
    .lit::after{         /* faint glow on the glass */
      background:radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), rgba(76,194,255,.10), transparent 65%);
    }
    .lit:hover::before, .lit:hover::after{ opacity:1; }
  }

  /* ---------- responsive ---------- */
  /* the bar tightens first, then folds into the menu icon before the links can wrap or touch the logo */
  @media (max-width:1280px){
    nav{ padding-left:24px; padding-right:24px; }
    .nav-links{ gap:22px; }
    .nav-links a{ font-size:14.5px; white-space:nowrap; }
    .nav-cta{ white-space:nowrap; }
  }
  @media (max-width:1100px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; }
    .nav-cta{ margin-left:auto; margin-right:14px; }   /* the button sits beside the menu icon, not in the middle of the bar */
  }
  @media (max-width:960px){
    .hero-grid{ grid-template-columns:1fr; gap:52px; }
    .hero-visual{ order:-1; }
    .hero-visual{ min-height:380px; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .svc-grid{ grid-template-columns:repeat(2,1fr); }
    .expertise{ grid-template-columns:1fr; }
    .proj-card{ flex-basis:calc((100% - 20px) / 2); }
    .process-list{ grid-template-columns:repeat(2,1fr); }
    .app-grid{ grid-template-columns:repeat(2,1fr); }
    .cert-card{ grid-template-columns:1fr; }
    .cert-visual{ border-right:none; border-bottom:1px solid var(--border); }
    .ai-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:680px){
    .nav-cta{ display:none; }
    .wrap{ padding:0 20px; }
    .hero{ padding:112px 0 56px; }
    .hero-visual{ min-height:240px; }
    .section-pad{ padding:60px 0; }
    .process-list, .app-grid, .svc-grid{ grid-template-columns:1fr; }
    .ai-focus{ grid-template-columns:1fr; }
    .ai-card{ padding:22px 20px; }
    .proj-card{ flex-basis:100%; }
    .cert-visual{ padding:26px 20px; }
    .cert-body{ padding:26px 22px 28px; }
    .cert-body h3{ font-size:23px; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .track-stats{ gap:26px 34px; }
    .ft-1{ right:-1%; } .ft-2{ left:-2%; } .ft-3{ right:-1%; }
    #contact{ padding:70px 0; }
  }

</head>

/* ============ keep the scroll position across a refresh ============
   The page is built from data.json after it loads, so the browser's own restore runs against a
   nearly empty page and lands at the top. Remember the position and put it back once the content exists. */
const SCROLL_KEY = 'scrollY:' + location.pathname;

function jumpTo(y){
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';     // html{ scroll-behavior:smooth } would animate the jump
  window.scrollTo(0, y);
  root.style.scrollBehavior = '';
}

function restoreScroll(){
  let y = 0;
  try { y = parseFloat(sessionStorage.getItem(SCROLL_KEY)) || 0; } catch(e){}
  const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  const returning = nav && (nav.type === 'reload' || nav.type === 'back_forward');   // a fresh visit starts at the top
  let restoredY = null;

  if(returning && y > 0){
    restoredY = y;
    jumpTo(y);
    /* Fonts and images settle after the first paint and shift the layout, so re-apply until the visitor scrolls. */
    let moved = false;
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(t =>
      window.addEventListener(t, () => { moved = true; }, { once: true, passive: true }));
    const settle = () => { if(!moved && Math.abs(window.scrollY - y) > 1) jumpTo(y); };
    if(document.fonts) document.fonts.ready.then(settle);
    if(document.readyState === 'complete') settle(); else window.addEventListener('load', settle);
  }

  const save = () => {
    /* Still on the restored spot: a sub-pixel layout nudge must not be stored, or the position creeps on every refresh. */
    if(restoredY !== null && Math.abs(window.scrollY - restoredY) < 1) return;
    try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); } catch(e){}
  };
  save();                                 // a fresh visit overwrites whatever an earlier visit left behind
  let queued = false;
  window.addEventListener('scroll', () => {
    if(!queued){ queued = true; requestAnimationFrame(() => { queued = false; save(); }); }
  }, { passive: true });
  window.addEventListener('pagehide', save);
}

/* deal the skill cards into 3, 2 or 1 columns so the columns end at nearly the same height */
function layoutSkills(){
  const grid = document.getElementById('skillGrid'), cards = grid._cards;
  if(!cards) return;
  const n = innerWidth <= 680 ? 1 : innerWidth <= 960 ? 2 : 3;
  if(grid.dataset.cols === String(n)) return;
  grid.dataset.cols = String(n); grid.innerHTML = '';
  const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'skill-col'; grid.appendChild(c); return c; });
  cards.forEach(card => cols[0].appendChild(card));   // measure every card at the real column width...
  const hs = cards.map(c => c.offsetHeight), sums = Array(n).fill(0), bins = Array.from({ length: n }, () => []);
  cards.slice(0, n).forEach((_, i) => { bins[i].push(i); sums[i] += hs[i]; });   // 01, 02, 03 head the three columns, so the numbering starts along the top...
  cards.map((_, i) => i).slice(n).sort((x, y) => hs[y] - hs[x]).forEach(i => { const k = sums.indexOf(Math.min(...sums)); bins[k].push(i); sums[k] += hs[i]; });   // ...the rest go tallest first into the shortest column,
  bins.forEach((b, k) => b.sort((x, y) => x - y).forEach(i => cols[k].appendChild(cards[i])));   // then back into numbered order within a column
}

    const chips = c.items.flatMap(i => i.split(' · '));
    const card = document.createElement('div'); card.className = 'skill-card';
    if(ci % 2) card.style.setProperty('--tint', 'rgba(255,122,69,.10)');   // sky and ember alternate by card, whichever column it lands in
    card.innerHTML = `
      <div class="skill-head">
        <span class="skill-ico">${icons[c.icon] || icons.cube}</span>
        <h3>${esc(c.title)}</h3>
        <span class="idx">${esc(c.idx)}</span>
      </div>
      <ul class="skill-chips">${chips.map((s, n) => `<li style="--c:${n}">${esc(s)}</li>`).join('')}</ul>
      <div class="skill-foot">${chips.length} skills</div>`;
    return card;
  });
  skillGrid.dataset.cols = '';
  layoutSkills();
  document.fonts && document.fonts.ready.then(() => { skillGrid.dataset.cols = ''; layoutSkills(); });   // fonts change line breaks, so deal the cards out again once they are in
  let skillResize = 0;
  addEventListener('resize', () => { clearTimeout(skillResize); skillResize = setTimeout(layoutSkills, 120); });
  document.getElementById('expertiseGrid').innerHTML = skills.expertise.map(e => `
    <div class="bar-item">

const modalOverlay = document.getElementById('modalOverlay');
let lastFocused = null;

function openModal(p){
  lastFocused = document.activeElement;
  document.getElementById('modalMedia').innerHTML = p.video
    ? `<iframe src="${p.video}" title="${esc(p.title)} demo" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : (icons[p.icon] || '');
  document.getElementById('modalCat').textContent = p.category;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalRole').textContent = p.role;
  document.getElementById('modalDesc').textContent = p.description;
  // a project can carry several stores; `link`/`linkLabel` stays supported for single ones
  const links = (p.links && p.links.length)
    ? p.links
    : (p.link ? [{ label: p.linkLabel || 'View project ↗', url: p.link }] : []);
  document.getElementById('modalLinkWrap').innerHTML = links
    .map(l => `<a class="modal-link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`)
    .join('');
  document.getElementById('modalTags').innerHTML = p.tags.map(t => `<span>${esc(t)}</span>`).join('');
  modalOverlay.classList.add('open');
  document.getElementById('modalClose').focus();
}
function closeModal(){
  modalOverlay.classList.remove('open');
  document.getElementById('modalMedia').innerHTML = '';   // stop any playing video
  if(lastFocused) lastFocused.focus();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal(); });

/* ===================== certificate lightbox ===================== */
const certLightbox = document.getElementById('certLightbox');

function openCert(c){
  if(typeof certLightbox.showModal !== 'function'){       // no <dialog> support: open the image itself
    window.open(c.image, '_blank', 'noopener');
    return;
  }
  const img = document.getElementById('certLightboxImg');
  img.src = c.image;
  img.alt = c.imageAlt || `${c.title} certificate`;
  certLightbox.setAttribute('aria-label', `${c.title} certificate, full size`);
  certLightbox.showModal();                               // Escape, focus trap and focus return are native

/* ============ interactions: reveal-on-scroll, bars, mobile nav ============ */
function initInteractions(){
  const belowFold = (el) => el.getBoundingClientRect().top > window.innerHeight * 0.92;

  const show = (el) => { el.classList.remove('pending'); el.classList.add('shown'); };

  /* Elements already on screen stay visible; only below-the-fold ones animate in. */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ show(e.target); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px 10% 0px' });

  document.querySelectorAll('.reveal').forEach(el => {
    if(belowFold(el)){ el.classList.add('pending'); io.observe(el); }
  });

  /* Backstop: if the observer ever misses, scrolling still reveals content. */
  window.addEventListener('scroll', () => {
    document.querySelectorAll('.reveal.pending').forEach(el => {
      if(el.getBoundingClientRect().top < window.innerHeight) show(el);
    });
    document.querySelectorAll('.bar-fill').forEach(b => {
      if(b.style.width === '0%' && b.getBoundingClientRect().top < window.innerHeight) b.style.width = b.dataset.pct + '%';
    });
  }, { passive: true });

  const barIo = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.style.width = e.target.dataset.pct + '%'; barIo.unobserve(e.target); }
    });
  }, { threshold: 0.4 });

  document.querySelectorAll('.bar-fill').forEach(b => {
    if(belowFold(b)){ b.style.width = '0%'; barIo.observe(b); }
  });

  const navToggle = document.getElementById('navToggle');
  const navLinksEl = document.querySelector('.nav-links');
  navToggle.addEventListener('click', () => {
    const open = navLinksEl.style.display === 'flex';
    navToggle.setAttribute('aria-expanded', String(!open));
    if(open){
      navLinksEl.style.cssText = '';
    } else {
      navLinksEl.style.cssText = 'display:flex; position:fixed; top:72px; left:0; right:0; background:#0B0F18; flex-direction:column; padding:24px 32px; border-bottom:1px solid rgba(255,255,255,.12); box-shadow:0 24px 48px rgba(0,0,0,.5); gap:20px;';
    }
  });
  navLinksEl.addEventListener('click', (e) => {
    if(e.target.tagName === 'A' && window.innerWidth <= 1100){
      navLinksEl.style.cssText = '';
      navToggle.setAttribute('aria-expanded', 'false');
    }
  });
}
/* ============ motion ============
   Decoration only: nothing here hides content by itself, and it stands down for prefers-reduced-motion. */
function initMotion(){
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const driven = !calm && !!window.CSS && CSS.supports('animation-timeline: scroll()');   // scroll-linked CSS runs off the main thread
  const root = document.documentElement;
  const all = (sel) => [...document.querySelectorAll(sel)];
  const once = (fn) => { let queued = false; return () => { if(queued) return; queued = true; requestAnimationFrame(() => { queued = false; fn(); }); }; };

  /* hero: number the entrance steps for the CSS to stagger */
  all('.hero-grid > div:first-child > *').forEach((el, i) => el.style.setProperty('--n', i));
  all('#heroStats .stat').forEach((el, i) => el.style.setProperty('--n', i));

  /* headings: every word rises out of its own mask; the accent words keep one continuous gradient */
  if(!calm){
    const split = (el) => {
      let w = 0;
      const words = (text, cls) => text.split(/\s+/).filter(Boolean).map(word =>
        `<span class="wd${cls}" aria-hidden="true"><span style="--w:${w++}">${esc(word)}</span></span>`).join(' ');
      el.setAttribute('aria-label', el.textContent.trim());
      el.innerHTML = [...el.childNodes].map(n => words(n.textContent, n.nodeType === 1 ? ' acc' : '')).join(' ');
    };
    all('h1, .sec-head h2, #contactHeading').forEach(split);
    const fitAccent = () => {
      const ws = all('h1 .acc > span');
      if(!ws.length) return;
      const space = parseFloat(getComputedStyle(ws[0]).fontSize) * .26;
      const total = ws.reduce((sum, e) => sum + e.offsetWidth, 0) + space * (ws.length - 1);
      let left = 0;
      ws.forEach(e => { e.style.backgroundSize = `${total}px 100%`; e.style.backgroundPosition = `${-left}px 0`; left += e.offsetWidth + space; });
    };
    fitAccent();
    if(document.fonts) document.fonts.ready.then(fitAccent);
    window.addEventListener('resize', once(fitAccent));
  }
  document.querySelector('.hero').classList.add('hero-in');

  /* cards land as they come on screen (a little before, so they are already moving when you see them) */
  const cardsIo = !calm && new IntersectionObserver((entries) => {
    entries.filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left)
      .forEach((e, n) => land(e.target, n));
  }, { rootMargin: '0px 0px 12% 0px' });
  const land = (el, n) => {
    el.style.setProperty('--d', Math.min(n, 6) * 70);
    el.classList.replace('rv-pending', 'rv-in');
    cardsIo.unobserve(el);
  };
  if(cardsIo) all('#svcGrid > *, #skillGrid > *, #projGrid > *, #appGrid > *, #processList > *').forEach(c => {
    if(c.getBoundingClientRect().top > window.innerHeight * .92){ c.classList.add('rv-pending'); cardsIo.observe(c); }
  });

  /* numbers count up the first time they are on screen; the real value stays in the DOM for screen readers */
  if(!calm){
    const run = (el) => {
      const to = parseFloat(el.dataset.to), dec = (el.dataset.to.split('.')[1] || '').length, tail = el.dataset.tail;
      const shown = el.firstElementChild, t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / 1500);
        shown.textContent = (to * (1 - Math.pow(1 - p, 4))).toFixed(dec) + tail;
        if(p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    const seen = new IntersectionObserver((entries) => entries.forEach(e => {
      if(!e.isIntersecting) return;
      seen.unobserve(e.target);
      setTimeout(() => run(e.target), e.target.closest('.hero') && performance.now() < 1800 ? 700 : 0);   // on load, let the hero tiles arrive first
    }), { threshold: .6 });
    all('.stat-num, .track-stat .tnum').forEach(el => {
      const m = /^(\d+(?:\.\d+)?)(.*)$/.exec(el.textContent.trim());
      if(!m) return;
      el.dataset.to = m[1]; el.dataset.tail = m[2];
      el.innerHTML = `<span aria-hidden="true">${(0).toFixed((m[1].split('.')[1] || '').length)}${esc(m[2])}</span><span class="sr-only">${esc(m[0])}</span>`;
      seen.observe(el);
    });
  }

  /* one scroll handler: header, reading progress, timeline fill, and a safety net for cards the observer missed */
  const bar = document.getElementById('scrollProgress');
  const header = document.querySelector('header');
  const timeline = document.getElementById('timeline');
  const onScroll = once(() => {
    const y = window.scrollY, max = root.scrollHeight - window.innerHeight;
    header.classList.toggle('scrolled', y > 24);
    if(!driven) bar.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`;
    const r = timeline.getBoundingClientRect();
    timeline.style.setProperty('--tl-progress', Math.max(0, Math.min(1, (window.innerHeight * .62 - r.top) / r.height)).toFixed(3));
    if(cardsIo) all('.rv-pending').forEach(c => { if(c.getBoundingClientRect().top < window.innerHeight) land(c, 0); });
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

  /* timeline dots light up once you have read past them */
  const reach = new IntersectionObserver((entries) => entries.forEach(e =>
    e.target.classList.toggle('reached', e.isIntersecting || e.boundingClientRect.top < 0)), { rootMargin: '0px 0px -38% 0px' });
  all('.tl-item').forEach(el => reach.observe(el));

  /* the nav link of the section you are in stays lit */
  const links = new Map(all('#navLinks a[href^="#"]').map(a => [a.getAttribute('href').slice(1), a]));
  const spy = new IntersectionObserver((entries) => entries.forEach(e => {
    if(!e.isIntersecting) return;
    const link = links.get(e.target.id === 'certifications' ? 'experience' : e.target.id);
    links.forEach(a => {
      a.classList.toggle('active', a === link);
      if(a === link) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  }), { rootMargin: '-45% 0px -50% 0px' });
  all('section[id]').forEach(s => spy.observe(s));

  if(!fine || calm) return;

  /* hero: the flat duo (the fallback) leans toward the pointer and a soft light trails it */
  const hero = document.querySelector('.hero');
  const tilt = document.querySelector('.tilt');
  const glow = document.querySelector('.hero-glow');
  let tx = 0, ty = 0, x = 0, y = 0, gx = 0, gy = 0, px = 0, py = 0, raf = 0;
  const glide = () => {
    x += (tx - x) * .09; y += (ty - y) * .09; px += (gx - px) * .14; py += (gy - py) * .14;
    tilt.style.transform = `rotateX(${y.toFixed(2)}deg) rotateY(${x.toFixed(2)}deg)`;
    glow.style.transform = `translate3d(${px.toFixed(1)}px, ${py.toFixed(1)}px, 0)`;
    raf = Math.abs(tx - x) + Math.abs(ty - y) + Math.abs(gx - px) + Math.abs(gy - py) > .05 ? requestAnimationFrame(glide) : 0;
  };
  hero.addEventListener('pointermove', (e) => {
    const r = hero.getBoundingClientRect();
    tx = (e.clientX / window.innerWidth - .5) * 16; ty = (.5 - e.clientY / window.innerHeight) * 10;
    gx = e.clientX - r.left; gy = e.clientY - r.top;
    if(!glow.classList.contains('on')){ px = gx; py = gy; glow.classList.add('on'); }
    if(!raf) raf = requestAnimationFrame(glide);
  });
  hero.addEventListener('pointerleave', () => { tx = ty = 0; glow.classList.remove('on'); if(!raf) raf = requestAnimationFrame(glide); });

  /* buttons lean toward the pointer */
  all('.btn, .nav-cta, .track-link').forEach(el => {
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect();
      el.style.translate = `${((e.clientX - r.left) / r.width - .5) * 10}px ${((e.clientY - r.top) / r.height - .5) * 8}px`;
    });
    el.addEventListener('pointerleave', () => { el.style.translate = ''; });
  });

  /* a soft light follows the pointer across glass cards */
  all('.svc-card, .skill-card, .proj-card, .app-tile, .proc-item, .ai-card, .stat, .cert-card').forEach(el => el.classList.add('lit'));
  let last = null;
  document.addEventListener('pointermove', (e) => {
    if(!last) requestAnimationFrame(() => {
      const card = last.target.closest && last.target.closest('.lit');
      if(card){
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', `${last.clientX - r.left}px`);
        card.style.setProperty('--my', `${last.clientY - r.top}px`);
      }
      last = null;
    });
    last = e;
  }, { passive: true });
}

/* ============ the stage ============
   One fixed three.js canvas sits behind the page. A foldable "iPhone Duo" travels between three anchors that are
   ordinary boxes in the layout: the hero, a sticky column beside the project list, and the contact section.
   Its wide inner screen plays a looping clip (the iOS and Flutter workflow in the hero, the projects showcase at the end). In the
   work section the same screen becomes the project browser: the left page lists the projects, the right page shows the
   one being read, and a tap on a row scrolls to it. The hinge is the model's own animation, scrubbed by the page.
   If WebGL, the CDN or the model fails, the flat duo in the hero stays and the page reads as a normal site. */
async function initStage(){
  const canvas = document.getElementById('stage3d');
  const A = { hero: document.querySelector('.hero-visual'), work: document.getElementById('stageWork'), contact: document.getElementById('stageContact') };
  if(!canvas || !A.hero) return;

    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
    await new Promise(r => 'requestIdleCallback' in window ? requestIdleCallback(r, { timeout: 1500 }) : setTimeout(r, 300));
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const css = getComputedStyle(document.documentElement);
    const DISP = css.getPropertyValue('--font-display').trim() || 'sans-serif';
    const BODY = css.getPropertyValue('--font-body').trim() || 'sans-serif';
    const MONO = css.getPropertyValue('--font-mono').trim() || 'monospace';
    try{ await Promise.all(['700 20px "Bricolage Grotesque"', '600 20px "Bricolage Grotesque"', '400 20px Inter', '500 20px Inter', '500 20px "IBM Plex Mono"'].map(f => document.fonts.load(f))); }catch(e){}

    const tags = [...document.querySelectorAll('.float-tag')].map(r => r.textContent.trim());
    const projects = (typeof projectsData !== 'undefined' && projectsData) || [];
    const workTitle = (document.querySelector('#projectsHead .sec-eyebrow')?.textContent || 'Projects').trim();
    const N = projects.length;
    const shots = (typeof heroScreens !== 'undefined' && heroScreens) || {};

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    let dpr = Math.min(window.devicePixelRatio || 1, fine ? 2 : 1.5);

    const FOV = 32, DIST = 9;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(FOV, 1, .1, 60);
    camera.position.set(0, 0, DIST);

    /* reflections: a small studio of soft boxes baked into an environment map; ember and sky strips give the rim colour */
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.BoxGeometry(24, 24, 24), new THREE.MeshBasicMaterial({ color: 0x5b6378, side: THREE.BackSide })));
    const softbox = (x, y, z, w, h, c, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    };
    softbox(0, 10, 3, 12, 4, 0xffffff, 7); softbox(-9, 2, 4, 3, 14, 0x4CC2FF, 6); softbox(9, 1, -2, 2, 16, 0xFF7A45, 7);
    softbox(0, -4, 9, 14, 2, 0xffffff, 3); softbox(-6, 4, -9, 8, 8, 0xffffff, 3);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, .04).texture;
    pmrem.dispose();
    const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-3, 4, 5); scene.add(key);
    const rimA = new THREE.PointLight(0xFF7A45, 26, 12); rimA.position.set(3.4, 1.2, -2.4); scene.add(rimA);
    const rimB = new THREE.PointLight(0x4CC2FF, 22, 12); rimB.position.set(-3.6, .6, -2); scene.add(rimB);

    /* ---- helpers ---- */
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
    const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    const wrap = (c, s, w, max) => {

      }
      if(line) lines.push(line);

    };

    const model = gltf.scene;

    model.traverse(o => { if(o.isMesh){ o.frustumCulled = false; if(o.material && o.material.envMapIntensity !== undefined) o.material.envMapIntensity = 1.4; } });
    const mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(gltf.animations[0]).play(); mixer.setTime(0); model.updateMatrixWorld(true);   // t=0 is flat open, t=1 is shut
    const bb = new THREE.Box3().setFromObject(model), ctr = bb.getCenter(new THREE.Vector3());
    const DEVICE_W = 2.7, k0 = DEVICE_W / (bb.max.x - bb.min.x);

    const loader = new THREE.TextureLoader();
    const still = (src) => src ? loader.loadAsync(src).then(onModel).catch(() => null) : Promise.resolve(null);
    /* each set is a still, an inner clip and an outer clip; the hero plays the workflow, the contact section the projects */
    const mkVideo = (src, preload) => {
      if(!src) return null;

      v.muted = true; v.loop = true; v.playsInline = true; v.preload = preload; v.crossOrigin = 'anonymous'; v.src = src;

    const TW = 1536, TH = 1074, PW = TW / 2, U = PW / 360, PHU = TH / U;
