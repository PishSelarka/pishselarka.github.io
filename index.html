<style>
  :root{
    /* ---- Liquid Glass, iOS style ---- */
    --base:#F5F7FB;                              /* ground the mesh sits on   */
    --bg:transparent;                            /* sections show the mesh    */
    --bg-alt:rgba(255,255,255,.60);
    --band:rgba(255,255,255,.52);                /* frosted section bands     */
    --surface:rgba(255,255,255,.62);             /* glass cards               */
    --surface-solid:rgba(255,255,255,.88);       /* modal                     */
    --surface-2:rgba(20,30,60,.10);              /* progress track            */
    --border:rgba(20,30,60,.11);
    --border-soft:rgba(20,30,60,.07);
    --sheen:inset 0 1px 0 rgba(255,255,255,.92); /* specular top edge         */
    --blur:saturate(180%) blur(26px);
    --blur-strong:saturate(200%) blur(36px);

    --text:#1D1D1F;
    --text-dim:#4C4C51;
    --text-faint:#5B5B61;
    --accent:#0071E3;               /* fills, buttons, big numerals */
    --accent-ink:#005BBF;           /* small text — passes AA on tinted glass */
    --accent-dim:rgba(0,113,227,.12);
    --accent-2:#6E3FD3;
    --signal:#9E4608;
    --screen-accent:#0A84FF;
    --screen-signal:#FF9F0A;

    --card:0 4px 18px rgba(28,42,84,.07);
    --glow:0 12px 32px rgba(28,42,84,.13);
    --glow-strong:0 20px 48px rgba(28,42,84,.19);
    /* radius scale — larger surfaces get larger corners, as on iOS */
    --r-xs:6px;     /* chips, tags, badges        */
    --r-sm:12px;    /* icon tiles, float tags     */
    --r-md:14px;    /* buttons, stat & app tiles  */
    --r-lg:18px;    /* content cards              */
    --r-xl:24px;    /* modal                      */
    --r-pill:999px; /* pills and bars             */
    --font-display:'Archivo','Helvetica Neue',sans-serif;
    --font-body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }

  *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  body{
    background:var(--base);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  section{ position:relative; }
  ::selection{ background:var(--accent-dim); color:var(--accent); }

  /* ---------- ambient background ---------- */
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      /* scrim first (paints on top): guarantees a light ground for text no
         matter how the blobs below happen to overlap */
      linear-gradient(rgba(255,255,255,.56), rgba(255,255,255,.56)),
      radial-gradient(ellipse 68% 52% at 10% 4%,   rgba(0,113,227,.26), transparent 62%),
      radial-gradient(ellipse 58% 48% at 90% 10%,  rgba(110,63,211,.22), transparent 62%),
      radial-gradient(ellipse 62% 50% at 78% 72%,  rgba(100,210,255,.28), transparent 60%),
      radial-gradient(ellipse 55% 45% at 16% 84%,  rgba(255,159,10,.14), transparent 60%),
      radial-gradient(ellipse 50% 40% at 48% 46%,  rgba(255,45,85,.10), transparent 62%);
  }
  /* the grid texture fought the glass — retired */

  .bracket-corner{
    position:absolute; width:18px; height:18px;
    border:2px solid var(--accent); opacity:.8;
    transition:width .3s ease, height .3s ease, opacity .3s ease;
  }
  .bracket-corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
  .bracket-corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
  .bracket-corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; border-radius:0 0 0 4px; }
  .bracket-corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; border-radius:0 0 4px 0; }

  /* ---------- nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:var(--blur-strong); backdrop-filter:var(--blur-strong);
    border-bottom:1px solid var(--border-soft);
  }
  nav{
    max-width:1180px; margin:0 auto; padding:22px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:var(--font-display); font-size:18px; font-weight:600;
    display:flex; align-items:center; gap:9px; letter-spacing:.005em;
  }
  .logo .dot{ width:8px; height:8px; background:var(--accent); border-radius:2px; flex-shrink:0; }
  .nav-links{ display:flex; gap:34px; }
  .nav-links a{
    font-size:15px; color:var(--text-dim); font-weight:500;
    position:relative; padding-bottom:4px; transition:color .25s ease;
  }
  .nav-links a:hover{ color:var(--text); }
  .nav-links a::after{
    content:''; position:absolute; bottom:0; left:0; width:0; height:1px;
    background:var(--accent); transition:width .25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  .nav-cta{
    font-family:var(--font-mono); font-size:12.5px; font-weight:500;
    color:#fff; background:var(--accent);
    padding:11px 20px; border-radius:var(--r-md); letter-spacing:.01em;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .nav-cta:hover{ transform:translateY(-1px); box-shadow:var(--glow); }
  .nav-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px; }
  .nav-toggle span{ width:22px; height:2px; background:var(--text); display:block; border-radius:2px; }

  /* ---------- hero ---------- */
  .hero{ padding:128px 0 76px; position:relative; z-index:1; }
  .hero-grid{ display:grid; grid-template-columns:1.16fr .84fr; gap:60px; align-items:center; }
  .status-pill{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:12px; color:var(--accent);
    border:1px solid rgba(0,113,227,.22); background:var(--accent-dim);
    box-shadow:var(--sheen);
    padding:8px 16px; border-radius:var(--r-pill); margin-bottom:26px; letter-spacing:.03em;
  }
  .status-pill .pulse{
    width:6px; height:6px; background:var(--accent); border-radius:50%;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.28; } }

  .eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
    letter-spacing:.15em; text-transform:uppercase; margin-bottom:18px;
  }
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(42px, 5.4vw, 66px); line-height:1.04; letter-spacing:-.025em;
    margin-bottom:22px; text-wrap:balance;
  }
  h1 .accent{
    background:linear-gradient(120deg, var(--accent) 10%, var(--accent-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-lede{ font-size:18px; line-height:1.65; color:var(--text-dim); max-width:545px; margin-bottom:34px; }
  .hero-lede strong{ color:var(--text); font-weight:600; }
  .hero-ctas{ display:flex; gap:14px; margin-bottom:42px; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-mono); font-size:13px; font-weight:500;
    padding:15px 26px; border-radius:var(--r-md); letter-spacing:.01em;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn-primary{ background:linear-gradient(120deg, var(--accent), #0059B8); color:#fff; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--glow-strong); }
  .btn-ghost{
    border:1px solid var(--border); color:var(--text); background:var(--surface);
    box-shadow:var(--sheen), var(--card);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:var(--glow); }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    box-shadow:var(--sheen), var(--card);
    padding:20px 18px;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .stat:hover{ transform:translateY(-3px); box-shadow:var(--glow); border-color:rgba(0,113,227,.45); }
  .stat-num{ font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--accent); letter-spacing:-.02em; }
  .stat-label{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }

  /* ---------- hero: foldable duo running an ARKit session ---------- */
  .hero-visual{
    display:flex; align-items:center; justify-content:center; position:relative; padding:14px 0;
    perspective:1600px; perspective-origin:52% 46%;
    --panel-w:186px; --panel-h:396px;
  }
  .device{
    position:relative; display:flex; align-items:stretch; flex-shrink:0;
    transform-style:preserve-3d;
    transform:rotateX(3deg) rotateY(-13deg);
  }
  .panel{
    position:relative; width:var(--panel-w); height:var(--panel-h); flex-shrink:0;
    border:1px solid #48484A; padding:8px;
    background:linear-gradient(170deg, #3A3A3C, #1D1D1F);
    box-shadow:0 22px 54px rgba(0,0,0,.24), 0 4px 12px rgba(0,0,0,.10),
               inset 0 1px 0 rgba(255,255,255,.16);
  }
  /* left leaf hinges on its inner edge and breathes open and closed */
  .panel-left{
    border-radius:28px 5px 5px 28px;
    transform-origin:100% 50%;
    animation:fold 15s ease-in-out infinite;
  }
  .panel-right{ border-radius:5px 28px 28px 5px; }
  @keyframes fold{
    0%,100%{ transform:rotateY(31deg); }
    50%    { transform:rotateY(13deg); }
  }
  .hinge{
    width:5px; align-self:stretch; flex-shrink:0;
    background:linear-gradient(90deg,#141416,#3A3A3C 45%,#141416);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .device-screen{
    position:relative; width:100%; height:100%; border-radius:22px; overflow:hidden;
    background:radial-gradient(ellipse 90% 60% at 50% 8%, #131A2B 0%, #080A11 70%);
    border:1px solid #05070C;
  }
  .panel-left .device-screen{ border-radius:22px 3px 3px 22px; }
  .panel-right .device-screen{ border-radius:3px 22px 22px 3px; }
  .cam{
    position:absolute; top:10px; right:14px; width:6px; height:6px;
    background:#04060B; border-radius:50%; z-index:6;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  }

  /* ----- left leaf: the app's scene list ----- */
  .ui-pane{ position:absolute; inset:0; padding:26px 14px 14px; display:flex; flex-direction:column; }
  .ui-title{
    font-family:var(--font-display); font-size:13px; font-weight:600; color:#ECEDF2;
    margin-bottom:3px;
  }
  .ui-sub{
    font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; color:#5D6478;
    text-transform:uppercase; margin-bottom:14px;
  }
  .ui-row{
    display:flex; align-items:center; gap:8px; padding:8px 9px; margin-bottom:6px;
    border-radius:9px; font-size:10.5px; color:#9AA3B8;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05);
  }
  .ui-row.on{ background:rgba(10,132,255,.16); border-color:rgba(10,132,255,.42); color:#E9ECF2; }
  .ui-dot{ width:5px; height:5px; border-radius:50%; background:#3A4055; flex-shrink:0; }
  .ui-row.on .ui-dot{ background:var(--screen-accent); box-shadow:0 0 7px var(--screen-accent); }
  .ui-meter{ margin-top:auto; }
  .ui-meter span{
    display:block; font-family:var(--font-mono); font-size:8px; letter-spacing:.08em;
    color:#5D6478; margin-bottom:5px;
  }
  .ui-bar{ height:3px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .ui-bar i{
    display:block; height:100%; width:72%; border-radius:999px;
    background:linear-gradient(90deg, var(--screen-accent), #BF5AF2);
  }

  /* ----- right leaf: the AR viewport ----- */
  .ar-floor{
    position:absolute; left:-60%; right:-60%; bottom:-14%; height:66%;
    background-image:
      linear-gradient(rgba(10,132,255,.34) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,132,255,.34) 1px, transparent 1px);
    background-size:26px 26px;
    transform:perspective(300px) rotateX(66deg);
    -webkit-mask-image:linear-gradient(to top, #000 6%, transparent 82%);
    mask-image:linear-gradient(to top, #000 6%, transparent 82%);
    animation:floorDrift 9s linear infinite;
  }
  @keyframes floorDrift{ from{ background-position:0 0; } to{ background-position:0 26px; } }

  .ar-stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; perspective:700px; }
  .wire-cube{
    width:86px; height:86px; position:relative; transform-style:preserve-3d;
    animation:spin 18s linear infinite; margin-top:-20px;
  }
  @keyframes spin{ from{ transform:rotateX(-16deg) rotateY(0deg); } to{ transform:rotateX(-16deg) rotateY(360deg); } }
  .wire-face{
    position:absolute; width:86px; height:86px;
    border:1px solid rgba(10,132,255,.62);
    background:rgba(10,132,255,.05);
  }
  .wf-front{ transform:translateZ(43px); }
  .wf-back{ transform:translateZ(-43px) rotateY(180deg); }
  .wf-right{ transform:rotateY(90deg) translateZ(43px); border-color:rgba(191,90,242,.5); }
  .wf-left{ transform:rotateY(-90deg) translateZ(43px); border-color:rgba(191,90,242,.5); }
  .wf-top{ transform:rotateX(90deg) translateZ(43px); }
  .wf-bottom{ transform:rotateX(-90deg) translateZ(43px); }

  .reticle{ position:absolute; top:50%; left:50%; width:128px; height:128px; transform:translate(-50%,-56%); }
  .reticle i{ position:absolute; width:13px; height:13px; border:1.5px solid var(--screen-signal); opacity:.9; }
  .reticle i:nth-child(1){ top:0; left:0; border-right:none; border-bottom:none; }
  .reticle i:nth-child(2){ top:0; right:0; border-left:none; border-bottom:none; }
  .reticle i:nth-child(3){ bottom:0; left:0; border-right:none; border-top:none; }
  .reticle i:nth-child(4){ bottom:0; right:0; border-left:none; border-top:none; }

  .scanline{
    position:absolute; left:0; right:0; height:1px; z-index:4;
    background:linear-gradient(90deg, transparent, var(--screen-accent), transparent);
    opacity:.55; animation:scan 4.5s linear infinite;
  }
  @keyframes scan{ 0%{ top:0%; } 100%{ top:100%; } }

  .hud{ position:absolute; left:0; right:0; z-index:5; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.08em; color:#5D6478; }
  .hud-top{ top:26px; padding:0 13px; display:flex; justify-content:flex-start; gap:4px; }
  .hud-top .sid{ color:var(--screen-accent); }
  .hud-bot{ bottom:16px; padding:0 13px; display:flex; align-items:center; gap:6px; }
  .hud-bot .rec{ width:4px; height:4px; border-radius:50%; background:var(--screen-signal); animation:pulse 2.4s ease-in-out infinite; flex-shrink:0; }

  .float-tag{
    position:absolute; font-family:var(--font-mono); font-size:11px; z-index:7;
    color:var(--text-dim); background:var(--surface);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:7px 11px; letter-spacing:.04em;
    box-shadow:var(--sheen), var(--card);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .float-tag::before{ content:''; position:absolute; width:8px; height:8px; border-left:1px solid var(--accent-2); border-top:1px solid var(--accent-2); top:-1px; left:-1px; }
  /* positioned against .hero-visual (outside the 3D subtree) so they always
     paint above the folded leaf */
  .ft-1{ top:3%; right:1%; }
  .ft-2{ top:43%; left:0; }
  .ft-3{ bottom:5%; right:3%; }

  /* ---------- flagship band ---------- */
  #track{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:46px 0; position:relative; z-index:1; }
  .track-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:30px; }
  .track-left{ display:flex; align-items:flex-start; gap:13px; }
  .track-badge{
    font-family:var(--font-mono); font-size:10px; color:#fff; background:var(--signal);
    padding:5px 9px; border-radius:var(--r-xs); letter-spacing:.09em; font-weight:500; margin-top:3px; white-space:nowrap;
  }
  .track-title{ font-family:var(--font-display); font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .track-sub{ font-size:13.5px; color:var(--text-faint); margin-top:3px; max-width:340px; line-height:1.5; }
  .track-stats{ display:flex; gap:40px; flex-wrap:wrap; }
  .track-stat .tnum{ font-family:var(--font-display); font-size:25px; font-weight:700; color:var(--accent); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .track-stat .tlabel{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:3px; letter-spacing:.06em; }
  .track-link{
    font-family:var(--font-mono); font-size:12.5px; color:var(--text);
    border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--sheen), var(--card); padding:11px 20px; white-space:nowrap;
    transition:border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .track-link:hover{ border-color:var(--accent); color:var(--accent); box-shadow:var(--glow); }
  @media (max-width:900px){ .track-row{ flex-direction:column; align-items:flex-start; } }

  /* ---------- services ---------- */
  .svc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .svc-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    padding:26px 22px; display:flex; flex-direction:column;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .svc-card:hover{ transform:translateY(-4px); box-shadow:var(--glow); border-color:rgba(0,113,227,.40); }
  .svc-icon{
    width:42px; height:42px; margin-bottom:16px; border:1px solid var(--border); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center; background:var(--bg-alt); flex-shrink:0;
  }
  .svc-icon svg{ width:21px; height:21px; }
  .svc-card h3{ font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:11px; letter-spacing:-.015em; }
  .svc-card p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:15px; flex:1; }
  .svc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .svc-chips span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); border:1px solid var(--border-soft); border-radius:var(--r-xs); padding:3px 9px; }
  .svc-note{
    margin-top:34px; padding:18px 22px; border:1px solid var(--border); border-radius:var(--r-lg);
    background:var(--surface); font-size:14.5px; line-height:1.65; color:var(--text-dim);
  }
  .svc-note strong{ color:var(--text); font-weight:600; }

  /* ---------- section headers ---------- */
  .section-pad{ padding:78px 0; position:relative; z-index:1; }
  .sec-head{ max-width:680px; margin-bottom:42px; }
  .sec-eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-ink);
    letter-spacing:.15em; text-transform:uppercase; margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .sec-eyebrow::before{ content:''; width:24px; height:1px; background:var(--accent); flex-shrink:0; }
  .sec-head h2{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(30px,3.4vw,42px); letter-spacing:-.022em; margin-bottom:15px; text-wrap:balance;
  }
  .sec-head p{ color:var(--text-dim); font-size:16.5px; line-height:1.62; }

  .reveal{ opacity:1; transform:none; transition:opacity .7s ease, transform .7s ease; }
  .reveal.pending{ opacity:0; transform:translateY(22px); }

  /* ---------- skills ---------- */
  #skills{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  .skill-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:48px; }
  .skill-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    padding:26px 22px;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .skill-card:hover{ transform:translateY(-3px); box-shadow:var(--glow); border-color:rgba(0,113,227,.40); }
  .skill-card h3{
    font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:15px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:10px;
  }
  .skill-card h3 .idx{ font-family:var(--font-mono); font-size:11.5px; font-weight:400; color:var(--accent-2); }
  .skill-card ul li{
    font-size:14.5px; color:var(--text-dim); padding:7px 0;
    border-top:1px solid var(--border-soft); display:flex; align-items:center; gap:9px;
  }
  .skill-card ul li:first-child{ border-top:none; }
  .skill-card ul li::before{ content:''; width:4px; height:4px; background:var(--accent); border-radius:1px; flex-shrink:0; }

  .expertise{ display:grid; grid-template-columns:1fr 1fr; gap:34px 54px; }
  .bar-item .bar-top{ display:flex; justify-content:space-between; gap:16px; font-size:14.5px; margin-bottom:9px; }
  .bar-item .bar-top .bname{ font-weight:500; }
  .bar-item .bar-top .bpct{ font-family:var(--font-mono); color:var(--accent-ink); font-variant-numeric:tabular-nums; }
  .bar-track{ height:6px; background:var(--surface-2); border-radius:var(--r-pill); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .bar-sub{ font-size:12.5px; color:var(--text-faint); margin-top:8px; }
  .expertise-note{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:24px; letter-spacing:.02em; }

  /* ---------- experience timeline ---------- */
  .timeline{
    position:relative; padding-left:34px; border-left:1px solid var(--border);
    --tl-dot:9px;        /* dot diameter */
    --tl-role-line:32px; /* line box of .tl-role — the dot centres on this */
  }
  .tl-item{ position:relative; padding-bottom:38px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{
    content:''; position:absolute; left:-39px;
    width:var(--tl-dot); height:var(--tl-dot);
    /* centre the dot on the first line of the role title, not the item's top edge */
    top:calc((var(--tl-role-line) - var(--tl-dot)) / 2);
    background:#fff; border:2px solid var(--accent); border-radius:50%;
  }
  .tl-item.is-education::before{ border-color:var(--accent-2); }
  .tl-head{ display:flex; align-items:baseline; gap:13px; flex-wrap:wrap; margin-bottom:7px; }
  .tl-role{ font-family:var(--font-display); font-size:20px; line-height:var(--tl-role-line); font-weight:600; letter-spacing:-.015em; }
  .tl-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); letter-spacing:.05em; }
  .tl-org{ font-size:14.5px; color:var(--accent-2); margin-bottom:11px; font-weight:500; }
  .tl-item.is-education .tl-org{ margin-bottom:0; }
  .tl-desc{ color:var(--text-dim); font-size:15.5px; line-height:1.66; max-width:700px; margin-bottom:13px; }
  .tl-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tl-tags span{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:var(--r-xs); padding:4px 10px;
  }

  /* ---------- projects ---------- */
  #projects{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  /* flex, not grid: an incomplete final row centres instead of stranding a card */
  .proj-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
  .proj-card{
    flex:0 1 calc((100% - 40px) / 3);
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); overflow:hidden; text-align:left; width:100%; color:inherit;
    box-shadow:var(--sheen), var(--card);
    cursor:pointer; transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    display:flex; flex-direction:column;
  }
  .proj-card:hover{ transform:translateY(-5px); border-color:rgba(0,113,227,.45); box-shadow:var(--glow-strong); }
  .proj-card:hover .bracket-corner{ width:24px; height:24px; opacity:1; }
  .proj-visual{
    height:152px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--border);
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,113,227,.05), transparent 70%);
  }
  .proj-visual svg{ width:50px; height:50px; position:relative; z-index:2; }
  .icon-stroke{ stroke:var(--accent); fill:none; }
  .icon-stroke-2{ stroke:var(--accent-2); fill:none; }
  .proj-num{
    position:absolute; top:10px; right:14px; font-family:var(--font-mono);
    font-size:10.5px; color:var(--text-faint); z-index:2; letter-spacing:.05em;
  }
  .proj-body{ padding:22px; flex:1; display:flex; flex-direction:column; }
  .proj-cat{ font-family:var(--font-mono); font-size:11px; color:var(--accent-ink); letter-spacing:.07em; margin-bottom:9px; text-transform:uppercase; }
  .proj-body h3{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:10px; letter-spacing:-.015em; }
  .proj-body p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:17px; flex:1; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .proj-tags span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); border:1px solid var(--border); border-radius:var(--r-xs); padding:4px 9px; }
  .proj-more-link{ text-align:center; margin-top:34px; }
  .proj-more-link a{ font-family:var(--font-mono); font-size:13px; color:var(--accent-ink); border-bottom:1px solid transparent; transition:border-color .25s ease; }
  .proj-more-link a:hover{ border-color:var(--accent); }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.42);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    z-index:1000; display:none; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--surface-solid); border:1px solid var(--border); max-width:620px; width:100%;
    -webkit-backdrop-filter:var(--blur-strong); backdrop-filter:var(--blur-strong);
    max-height:86vh; overflow-y:auto; position:relative; border-radius:var(--r-xl); box-shadow:var(--glow-strong);
  }
  .modal-media{ height:210px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--border); position:relative; }
  .modal-media iframe{ width:100%; height:100%; border:none; display:block; }
  .modal-media svg{ width:66px; height:66px; }
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:34px; height:34px; background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:50%;
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;
    transition:border-color .25s ease, color .25s ease;
  }
  .modal-close:hover{ border-color:var(--signal); color:var(--signal); }
  .modal-content{ padding:28px; }
  .modal-content h3{ font-family:var(--font-display); font-size:25px; margin-bottom:7px; letter-spacing:-.02em; }
  .modal-role{ font-size:13.5px; color:var(--accent-2); margin-bottom:15px; font-weight:500; }
  .modal-content p{ font-size:15.5px; line-height:1.66; color:var(--text-dim); margin-bottom:17px; }
  .modal-link{ display:inline-block; font-family:var(--font-mono); font-size:12.5px; color:var(--accent-ink); margin-bottom:17px; border-bottom:1px solid transparent; }
  .modal-link:hover{ border-color:var(--accent); }

  /* ---------- shipped apps ---------- */
  .app-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .app-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    box-shadow:var(--sheen), var(--card);
    padding:20px 18px; display:flex; align-items:center; gap:14px; color:inherit;
  }
  a.app-tile{ transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease; }
  a.app-tile:hover{ transform:translateY(-4px); border-color:rgba(110,63,211,.42); box-shadow:var(--glow); }
  .app-meta{ display:flex; align-items:center; gap:9px; margin-top:5px; flex-wrap:wrap; }
  .app-rating{ font-family:var(--font-mono); font-size:10.5px; color:var(--signal); }
  .app-store{ font-family:var(--font-mono); font-size:10px; color:var(--accent-ink); letter-spacing:.05em; }
  .app-icon{
    width:44px; height:44px; flex-shrink:0; border:1px solid var(--border); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center; background:var(--bg-alt);
  }
  .app-icon svg{ width:22px; height:22px; }
  .app-tile h3{ font-family:var(--font-display); font-size:14.5px; font-weight:600; line-height:1.3; letter-spacing:-.01em; }
  .app-genre{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; }
  .app-dev-link{ text-align:center; margin-top:28px; }
  .app-dev-link a{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); border-bottom:1px solid var(--border); transition:color .25s ease, border-color .25s ease; }
  .app-dev-link a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------- process ---------- */
  #process{ background:var(--band); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  .process-list{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .proc-item{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sheen), var(--card);
    padding:28px 22px;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .proc-item:hover{ transform:translateY(-4px); box-shadow:var(--glow); border-color:rgba(0,113,227,.40); }
  .proc-num{ font-family:var(--font-mono); font-size:11.5px; color:var(--signal); margin-bottom:18px; letter-spacing:.07em; }
  .proc-item h3{ font-family:var(--font-display); font-size:18.5px; font-weight:600; margin-bottom:12px; letter-spacing:-.015em; }
  .proc-item p{ font-size:14.5px; line-height:1.6; color:var(--text-dim); margin-bottom:15px; }
  .proc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .proc-chips span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); border:1px solid var(--border-soft); border-radius:var(--r-xs); padding:3px 9px; }

  /* ---------- faq ---------- */
  .faq-list{ max-width:760px; }
  .faq-item{ border-bottom:1px solid var(--border-soft); }
  .faq-q{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.012em;
    padding:21px 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:20px;
  }
  .faq-q .plus{ font-family:var(--font-mono); color:var(--accent-ink); font-size:17px; transition:transform .3s ease; flex-shrink:0; }
  .faq-item.open .plus{ transform:rotate(45deg); }
  .faq-a{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .faq-a p{ padding-bottom:21px; color:var(--text-dim); font-size:15.5px; line-height:1.66; max-width:640px; }

  /* ---------- contact ---------- */
  #contact{ padding:92px 0; text-align:center; position:relative; z-index:1; }
  #contact h2{ font-family:var(--font-display); font-weight:700; font-size:clamp(32px,4.4vw,50px); letter-spacing:-.028em; margin-bottom:18px; text-wrap:balance; }
  #contact .sub{ color:var(--text-dim); font-size:16.5px; line-height:1.6; max-width:540px; margin:0 auto 38px; }
  /* 7 chips need 1234px but only 1116px is available, so they wrap. Capping the
     row forces a balanced 4 + 3 instead of stranding one chip alone. */
  .contact-grid{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; max-width:820px; margin:0 auto; }
  .contact-chip{
    font-family:var(--font-mono); font-size:13.5px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface); box-shadow:var(--sheen), var(--card); padding:11px 20px;
    transition:border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  a.contact-chip:hover{ border-color:var(--accent); color:var(--accent); box-shadow:var(--glow); }

  footer{ border-top:1px solid var(--border-soft); padding:40px 0; position:relative; z-index:1; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .footer-brand{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint); }
  .footer-links{ display:flex; gap:24px; }
  .footer-links a{ font-size:13.5px; color:var(--text-dim); transition:color .25s ease; }
  .footer-links a:hover{ color:var(--accent); }

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .hero-grid{ grid-template-columns:1fr; gap:52px; }
    .hero-visual{ order:-1; }
    .hero-visual{ --panel-w:170px; --panel-h:366px; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .skill-grid{ grid-template-columns:repeat(2,1fr); }
    .svc-grid{ grid-template-columns:repeat(2,1fr); }
    .expertise{ grid-template-columns:1fr; }
    .proj-card{ flex-basis:calc((100% - 20px) / 2); }
    .process-list{ grid-template-columns:repeat(2,1fr); }
    .app-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:680px){
    .nav-links, .nav-cta{ display:none; }
    .nav-toggle{ display:flex; }
    .wrap{ padding:0 20px; }
    .hero{ padding:112px 0 56px; }
    .hero-visual{ --panel-w:140px; --panel-h:308px; }
    .section-pad{ padding:60px 0; }
    .skill-grid, .process-list, .app-grid, .svc-grid{ grid-template-columns:1fr; }
    .proj-card{ flex-basis:100%; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .track-stats{ gap:26px 34px; }
    .ft-1{ right:-1%; } .ft-2{ left:-2%; } .ft-3{ right:-1%; }
    #contact{ padding:70px 0; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <nav>
    <div class="logo" id="logo"></div>
    <ul class="nav-links" id="navLinks"></ul>
    <a href="#contact" class="nav-cta" id="navCta"></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="home">
  <div class="wrap hero-grid">
    <div>
      <div class="status-pill"><span class="pulse"></span> <span id="statusText"></span></div>
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 id="heroHeadline"></h1>
      <p class="hero-lede" id="heroLede"></p>
      <div class="hero-ctas" id="heroCtas"></div>
      <div class="stat-row" id="heroStats"></div>
    </div>

    <div class="hero-visual">
      <div class="device" role="img" aria-label="A foldable dual-screen phone running an ARKit session: a scene list on the left panel, and on the right a wireframe model anchored to a detected floor plane">
        <div class="panel panel-left">
          <div class="device-screen">
            <div class="ui-pane">
              <div class="ui-title">Scenes</div>
              <div class="ui-sub">ARKit · SceneKit</div>
              <div class="ui-row on"><span class="ui-dot"></span>Living Room</div>
              <div class="ui-row"><span class="ui-dot"></span>Showroom</div>
              <div class="ui-row"><span class="ui-dot"></span>Face Try-On</div>
              <div class="ui-row"><span class="ui-dot"></span>Car Rims</div>
              <div class="ui-meter">
                <span>ANCHORS · 12</span>
                <div class="ui-bar"><i></i></div>
              </div>
            </div>
          </div>
        </div>
        <div class="hinge"></div>
        <div class="panel panel-right">
          <div class="device-screen">
            <div class="ar-floor"></div>
            <div class="ar-stage">
              <div class="wire-cube">
                <div class="wire-face wf-front"></div>
                <div class="wire-face wf-back"></div>
                <div class="wire-face wf-right"></div>
                <div class="wire-face wf-left"></div>
                <div class="wire-face wf-top"></div>
                <div class="wire-face wf-bottom"></div>
              </div>
            </div>
            <div class="reticle"><i></i><i></i><i></i><i></i></div>
            <div class="scanline"></div>
            <div class="cam"></div>
            <div class="hud hud-top">
              <span id="hudLabel"></span><span class="sid" id="hudSession"></span>
            </div>
            <div class="hud hud-bot"><span class="rec"></span><span id="hudStatus"></span></div>
          </div>
        </div>
      </div>
      <div id="deviceTags"></div>
    </div>
  </div>
</section>

<!-- ============ FLAGSHIP BAND ============ -->
<section id="track">
  <div class="wrap track-row">
    <div class="track-left">
      <span class="track-badge" id="trackBadge"></span>
      <div>
        <div class="track-title" id="trackTitle"></div>
        <div class="track-sub" id="trackSub"></div>
      </div>
    </div>
    <div class="track-stats" id="trackStats"></div>
    <a class="track-link" id="trackLink" target="_blank" rel="noopener"></a>
  </div>
</section>

<!-- ============ SERVICES ============ -->
<section id="services" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="servicesHead"></div>
    <div class="svc-grid reveal" id="svcGrid"></div>
    <div class="svc-note reveal" id="svcNote"></div>
  </div>
</section>

<!-- ============ SKILLS ============ -->
<section id="skills" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="skillsHead"></div>
    <div class="skill-grid reveal" id="skillGrid"></div>
    <div class="expertise reveal" id="expertiseGrid"></div>
    <p class="expertise-note reveal" id="expertiseNote"></p>
  </div>
</section>

<!-- ============ EXPERIENCE ============ -->
<section id="experience" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="experienceHead"></div>
    <div class="timeline reveal" id="timeline"></div>
  </div>
</section>

<!-- ============ PROJECTS ============ -->
<section id="projects" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="projectsHead"></div>
    <div class="proj-grid reveal" id="projGrid"></div>
    <div class="proj-more-link reveal" id="projMoreLink"></div>
  </div>
</section>

<!-- ============ SHIPPED APPS ============ -->
<section id="apps" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="appsHead"></div>
    <div class="app-grid reveal" id="appGrid"></div>
    <div class="app-dev-link reveal" id="appDevLink"></div>
  </div>
</section>

<!-- ============ PROCESS ============ -->
<section id="process" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="processHead"></div>
    <div class="process-list reveal" id="processList"></div>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section id="faq" class="section-pad">
  <div class="wrap">
    <div class="sec-head reveal" id="faqHead"></div>
    <div class="faq-list reveal" id="faqList"></div>
  </div>
</section>

<!-- ============ CONTACT ============ -->
<section id="contact">
  <div class="wrap reveal">
    <h2 id="contactHeading"></h2>
    <p class="sub" id="contactSub"></p>
    <div class="contact-grid" id="contactGrid"></div>
  </div>
</section>

<footer>
  <div class="wrap footer-row">
    <div class="footer-brand" id="footerBrand"></div>
    <div class="footer-links" id="footerLinks"></div>
  </div>
</footer>

<!-- ============ PROJECT MODAL ============ -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-content">
      <div class="proj-cat" id="modalCat"></div>
      <h3 id="modalTitle"></h3>
      <div class="modal-role" id="modalRole"></div>
      <p id="modalDesc"></p>
      <div id="modalLinkWrap"></div>
      <div class="proj-tags" id="modalTags"></div>
    </div>
  </div>
</div>

<div id="loadError" style="display:none; position:fixed; bottom:20px; left:20px; right:20px; max-width:480px; margin:0 auto; background:#FFFFFF; border:1px solid #0071E3; border-radius:var(--r-md); padding:16px 20px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#1D1D1F; box-shadow:0 10px 30px rgba(0,0,0,.14); line-height:1.6; z-index:2000;">
  Couldn't load <code>data.json</code>. If you opened this file directly (file://), run a local server instead — e.g. <code>python3 -m http.server</code> — since browsers block local file fetches for security.
</div>

<script>
/* =====================================================================
   ALL SITE CONTENT LIVES IN data.json — edit that file, not this script,
   to change any text, stats, projects, skills, experience or FAQs.
   ===================================================================== */

const icons = {
  bag: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M10 16h28l-2.5 24H12.5z" stroke-width="2" stroke-linejoin="round"/><path class="icon-stroke-2" d="M18 20v-6a6 6 0 0 1 12 0v6" stroke-width="2" stroke-linecap="round"/></svg>`,
  brush: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M12 36c0-4 2-6 6-6s6 2 6 6-2 6-8 6H8c2-1 4-2 4-6z" stroke-width="2" stroke-linejoin="round"/><path class="icon-stroke-2" d="m22 32 16-18a3.5 3.5 0 0 0-5-5L15 25" stroke-width="2" stroke-linejoin="round"/></svg>`,
  pipeline: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M8 12h32M12 22h24M17 32h14M21 42h6" stroke-width="2" stroke-linecap="round"/><circle class="icon-stroke-2" cx="24" cy="27" r="1.6" stroke-width="2"/></svg>`,
  cube: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M24 6 40 15v18l-16 9-16-9V15z" stroke-width="2" stroke-linejoin="round"/><path class="icon-stroke-2" d="m8 15 16 9 16-9M24 24v18" stroke-width="2" stroke-linejoin="round"/></svg>`,
  target: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M8 8v8M8 8h8M40 8v8M40 8h-8M8 40v-8M8 40h8M40 40v-8M40 40h-8" stroke-width="2" stroke-linecap="round"/><circle class="icon-stroke-2" cx="24" cy="24" r="8" stroke-width="2"/><circle cx="24" cy="24" r="2.2" fill="#6E3FD3"/></svg>`,
  grid: `<svg viewBox="0 0 48 48"><rect class="icon-stroke" x="7" y="7" width="15" height="15" rx="3" stroke-width="2"/><rect class="icon-stroke-2" x="26" y="7" width="15" height="15" rx="3" stroke-width="2"/><rect class="icon-stroke-2" x="7" y="26" width="15" height="15" rx="3" stroke-width="2"/><rect class="icon-stroke" x="26" y="26" width="15" height="15" rx="3" stroke-width="2"/></svg>`,
  heart: `<svg viewBox="0 0 48 48"><path class="icon-stroke-2" d="M24 40S6 28.5 6 17a10 10 0 0 1 18-6 10 10 0 0 1 18 6c0 11.5-18 23-18 23z" stroke-width="2" stroke-linejoin="round"/></svg>`,
  cards: `<svg viewBox="0 0 48 48"><rect class="icon-stroke" x="6" y="12" width="22" height="28" rx="3" stroke-width="2"/><path class="icon-stroke-2" d="M32 16h8a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2h-4" stroke-width="2" stroke-linecap="round"/><path class="icon-stroke-2" d="M13 22h8M17 18v8" stroke-width="2" stroke-linecap="round"/></svg>`,
  piano: `<svg viewBox="0 0 48 48"><rect class="icon-stroke" x="6" y="12" width="36" height="24" rx="3" stroke-width="2"/><path class="icon-stroke" d="M16 12v24M26 12v24M36 12v24" stroke-width="2"/><path class="icon-stroke-2" d="M13 12v9h6v-9M23 12v9h6v-9M33 12v9h6v-9" stroke-width="2" stroke-linejoin="round"/></svg>`,
  wheel: `<svg viewBox="0 0 48 48"><circle class="icon-stroke" cx="24" cy="26" r="15" stroke-width="2"/><path class="icon-stroke" d="M24 11v30M9 26h30M13.4 15.4l21.2 21.2M34.6 15.4 13.4 36.6" stroke-width="2"/><path class="icon-stroke-2" d="m24 5 4 6h-8z" stroke-width="2" stroke-linejoin="round"/></svg>`,
  timer: `<svg viewBox="0 0 48 48"><circle class="icon-stroke" cx="24" cy="27" r="15" stroke-width="2"/><path class="icon-stroke-2" d="M24 18v9l6 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="icon-stroke" d="M19 6h10M24 6v6" stroke-width="2" stroke-linecap="round"/></svg>`,
  brief: `<svg viewBox="0 0 48 48"><rect class="icon-stroke" x="6" y="14" width="36" height="26" rx="3" stroke-width="2"/><path class="icon-stroke-2" d="M18 14v-4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4" stroke-width="2" stroke-linecap="round"/><path class="icon-stroke" d="M6 24h36" stroke-width="2"/></svg>`,
  shield: `<svg viewBox="0 0 48 48"><path class="icon-stroke" d="M24 5 40 11v13c0 10-7 16-16 19-9-3-16-9-16-19V11z" stroke-width="2" stroke-linejoin="round"/><path class="icon-stroke-2" d="m17 24 5 5 10-10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  person: `<svg viewBox="0 0 48 48"><circle class="icon-stroke" cx="24" cy="17" r="8" stroke-width="2"/><path class="icon-stroke-2" d="M9 41c0-8 6.7-13 15-13s15 5 15 13" stroke-width="2" stroke-linecap="round"/></svg>`
};

let projectsData = [];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

fetch('data.json')
  .then(r => { if(!r.ok) throw new Error('fetch failed'); return r.json(); })
  .then(data => { renderAll(data); initInteractions(); })
  .catch(err => {
    console.error('Failed to load data.json', err);
    document.getElementById('loadError').style.display = 'block';
  });

function renderAll(data){
  document.title = data.site.title;
  document.querySelector('meta[name="description"]').setAttribute('content', data.site.description);

  renderNav(data.nav, data.site);
  renderHero(data.hero);
  renderTrack(data.track);
  renderServices(data.services);
  renderSkills(data.skills);
  renderExperience(data.experience);
  renderProjects(data.projects);
  renderApps(data.apps);
  renderProcess(data.process);
  renderFaq(data.faq);
  renderContact(data.contact);
  renderFooter(data.footer);
}

function renderNav(nav, site){
  document.getElementById('logo').innerHTML = `<span class="dot"></span> ${site.logo}`;
  document.getElementById('navLinks').innerHTML = nav.links.map(l => `<li><a href="${l.href}">${esc(l.label)}</a></li>`).join('');
  const cta = document.getElementById('navCta');
  cta.textContent = nav.cta.label;
  cta.href = nav.cta.href;
}

function renderHero(hero){
  document.getElementById('statusText').textContent = hero.status;
  document.getElementById('heroEyebrow').textContent = hero.eyebrow;
  document.getElementById('heroHeadline').innerHTML = `${esc(hero.headlinePre)}<span class="accent">${esc(hero.headlineAccent)}</span>${esc(hero.headlinePost)}`;
  document.getElementById('heroLede').innerHTML = hero.lede;
  document.getElementById('heroCtas').innerHTML = hero.ctas.map(c =>
    `<a href="${c.href}" class="btn ${c.type === 'primary' ? 'btn-primary' : 'btn-ghost'}"${c.download ? ' download' : ''}>${esc(c.label)}</a>`
  ).join('');
  document.getElementById('heroStats').innerHTML = hero.stats.map(s =>
    `<div class="stat"><div class="stat-num">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`
  ).join('');
  document.getElementById('hudLabel').textContent = hero.sessionLabel;
  document.getElementById('hudSession').textContent = hero.sessionId;
  document.getElementById('hudStatus').textContent = hero.sessionStatus;
  document.getElementById('deviceTags').innerHTML = hero.deviceTags.map((t, i) =>
    `<div class="float-tag ft-${i+1}">${esc(t)}</div>`
  ).join('');
}

function renderTrack(track){
  document.getElementById('trackBadge').textContent = track.badge;
  document.getElementById('trackTitle').textContent = track.title;
  document.getElementById('trackSub').innerHTML = track.sub;
  document.getElementById('trackStats').innerHTML = track.stats.map(s =>
    `<div class="track-stat"><div class="tnum">${esc(s.num)}</div><div class="tlabel">${esc(s.label)}</div></div>`
  ).join('');
  const link = document.getElementById('trackLink');
  if(track.linkUrl && track.linkLabel){
    link.textContent = track.linkLabel;
    link.href = track.linkUrl;
  } else {
    link.remove();                    // no link configured — drop it from the band
  }
}

function secHead(eyebrow, title, intro){
  return `<div class="sec-eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${intro ? `<p>${esc(intro)}</p>` : ''}`;
}

function renderServices(svc){
  document.getElementById('servicesHead').innerHTML = secHead(svc.sectionEyebrow, svc.sectionTitle, svc.sectionIntro);
  document.getElementById('svcGrid').innerHTML = svc.items.map(s => `
    <div class="svc-card">
      <div class="svc-icon">${icons[s.icon] || ''}</div>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
      <div class="svc-chips">${s.chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>
    </div>
  `).join('');
  document.getElementById('svcNote').innerHTML = svc.note;
}

function renderSkills(skills){
  document.getElementById('skillsHead').innerHTML = secHead(skills.sectionEyebrow, skills.sectionTitle, skills.sectionIntro);
  document.getElementById('skillGrid').innerHTML = skills.categories.map(c => `
    <div class="skill-card">
      <h3><span class="idx">${esc(c.idx)}</span> ${esc(c.title)}</h3>
      <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    </div>
  `).join('');
  document.getElementById('expertiseGrid').innerHTML = skills.expertise.map(e => `
    <div class="bar-item">
      <div class="bar-top"><span class="bname">${esc(e.name)}</span><span class="bpct">${e.pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" data-pct="${e.pct}" style="width:${e.pct}%"></div></div>
      <div class="bar-sub">${esc(e.sub)}</div>
    </div>
  `).join('');
  document.getElementById('expertiseNote').textContent = skills.expertiseNote || '';
}

function renderExperience(exp){
  document.getElementById('experienceHead').innerHTML = secHead(exp.sectionEyebrow, exp.sectionTitle, exp.sectionIntro);
  document.getElementById('timeline').innerHTML = exp.items.map(item => `
    <div class="tl-item${item.type === 'education' ? ' is-education' : ''}">
      <div class="tl-head"><span class="tl-role">${esc(item.role)}</span><span class="tl-date">${esc(item.date)}</span></div>
      <div class="tl-org">${esc(item.org)}</div>
      ${item.desc ? `<p class="tl-desc">${esc(item.desc)}</p>` : ''}
      ${item.tags && item.tags.length ? `<div class="tl-tags">${item.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
    </div>
  `).join('');
}

function renderProjects(proj){
  projectsData = proj.items;
  document.getElementById('projectsHead').innerHTML = secHead(proj.sectionEyebrow, proj.sectionTitle, proj.sectionIntro);
  document.getElementById('projGrid').innerHTML = proj.items.map((p, i) => `
    <button type="button" class="proj-card" data-idx="${i}" aria-label="Open details for ${esc(p.title)}">
      <span class="bracket-corner tl"></span><span class="bracket-corner tr"></span>
      <span class="bracket-corner bl"></span><span class="bracket-corner br"></span>
      <div class="proj-visual">
        <div class="proj-num">${String(i+1).padStart(2,'0')}</div>
        ${icons[p.icon] || ''}
      </div>
      <div class="proj-body">
        <div class="proj-cat">${esc(p.category)}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.description.slice(0, 118))}${p.description.length > 118 ? '…' : ''}</p>
        <div class="proj-tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </div>
    </button>
  `).join('');
  document.querySelectorAll('.proj-card').forEach(card => {
    card.addEventListener('click', () => openModal(projectsData[card.dataset.idx]));
  });
  document.getElementById('projMoreLink').innerHTML = `<a href="${proj.moreLinkUrl}">${esc(proj.moreLinkLabel)}</a>`;
}

function renderApps(apps){
  document.getElementById('appsHead').innerHTML = secHead(apps.sectionEyebrow, apps.sectionTitle, apps.sectionIntro);
  document.getElementById('appGrid').innerHTML = apps.items.map(a => {
    const meta = [
      `<span class="app-genre">${esc(a.genre)}</span>`,
      a.rating ? `<span class="app-rating">★ ${esc(a.rating)}</span>` : '',
      a.url ? `<span class="app-store">View ↗</span>` : ''
    ].filter(Boolean).join('');
    const inner = `<div class="app-icon">${icons[a.icon] || ''}</div>
      <div><h3>${esc(a.title)}</h3><div class="app-meta">${meta}</div></div>`;
    return a.url
      ? `<a class="app-tile" href="${a.url}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="app-tile">${inner}</div>`;
  }).join('');
  document.getElementById('appDevLink').innerHTML = `<a href="${apps.devLinkUrl}">${esc(apps.devLinkLabel)}</a>`;
}

function renderProcess(process){
  document.getElementById('processHead').innerHTML = secHead(process.sectionEyebrow, process.sectionTitle, process.sectionIntro);
  document.getElementById('processList').innerHTML = process.steps.map(s => `
    <div class="proc-item">
      <div class="proc-num">${esc(s.num)}</div>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
      <div class="proc-chips">${s.chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderFaq(faq){
  document.getElementById('faqHead').innerHTML = secHead(faq.sectionEyebrow, faq.sectionTitle, '');
  const faqList = document.getElementById('faqList');
  faqList.innerHTML = faq.items.map(f => `
    <div class="faq-item">
      <button type="button" class="faq-q" aria-expanded="false"><span>${esc(f.q)}</span><span class="plus" aria-hidden="true">+</span></button>
      <div class="faq-a"><p>${esc(f.a)}</p></div>
    </div>
  `).join('');
  faqList.querySelectorAll('.faq-item').forEach(item => {
    const btn = item.querySelector('.faq-q');
    const ans = item.querySelector('.faq-a');
    btn.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      faqList.querySelectorAll('.faq-item.open').forEach(o => {
        o.classList.remove('open');
        o.querySelector('.faq-a').style.maxHeight = null;
        o.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      });
      if(!isOpen){
        item.classList.add('open');
        ans.style.maxHeight = ans.scrollHeight + 'px';
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
}

function renderContact(contact){
  document.getElementById('contactHeading').textContent = contact.heading;
  document.getElementById('contactSub').textContent = contact.sub;
  document.getElementById('contactGrid').innerHTML = contact.chips.map(c => {
    if(!c.href) return `<span class="contact-chip">${esc(c.label)}</span>`;
    const target = c.href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
    const dl = c.download ? ' download' : '';
    return `<a class="contact-chip" href="${c.href}"${target}${dl}>${esc(c.label)}</a>`;
  }).join('');
}

function renderFooter(footer){
  document.getElementById('footerBrand').textContent = footer.brand;
  document.getElementById('footerLinks').innerHTML = footer.links.map(l => `<a href="${l.href}">${esc(l.label)}</a>`).join('');
}

/* ===================== modal ===================== */
const modalOverlay = document.getElementById('modalOverlay');
let lastFocused = null;

function openModal(p){
  lastFocused = document.activeElement;
  document.getElementById('modalMedia').innerHTML = p.video
    ? `<iframe src="${p.video}" title="${esc(p.title)} demo" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : (icons[p.icon] || '');
  document.getElementById('modalCat').textContent = p.category;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalRole').textContent = p.role;
  document.getElementById('modalDesc').textContent = p.description;
  document.getElementById('modalLinkWrap').innerHTML = p.link
    ? `<a class="modal-link" href="${p.link}" target="_blank" rel="noopener">${esc(p.linkLabel || 'View project ↗')}</a>`
    : '';
  document.getElementById('modalTags').innerHTML = p.tags.map(t => `<span>${esc(t)}</span>`).join('');
  modalOverlay.classList.add('open');
  document.getElementById('modalClose').focus();
}
function closeModal(){
  modalOverlay.classList.remove('open');
  document.getElementById('modalMedia').innerHTML = '';   // stop any playing video
  if(lastFocused) lastFocused.focus();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal(); });

/* ============ interactions: reveal-on-scroll, bars, mobile nav ============ */
function initInteractions(){
  const belowFold = (el) => el.getBoundingClientRect().top > window.innerHeight * 0.92;

  /* Elements already on screen stay visible; only below-the-fold ones animate in. */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.remove('pending'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });

  document.querySelectorAll('.reveal').forEach(el => {
    if(belowFold(el)){ el.classList.add('pending'); io.observe(el); }
  });

  /* Backstop: if the observer ever misses, scrolling still reveals content. */
  window.addEventListener('scroll', () => {
    document.querySelectorAll('.reveal.pending').forEach(el => {
      if(el.getBoundingClientRect().top < window.innerHeight) el.classList.remove('pending');
    });
    document.querySelectorAll('.bar-fill').forEach(b => {
      if(b.style.width === '0%' && b.getBoundingClientRect().top < window.innerHeight) b.style.width = b.dataset.pct + '%';
    });
  }, { passive: true });

  const barIo = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.style.width = e.target.dataset.pct + '%'; barIo.unobserve(e.target); }
    });
  }, { threshold: 0.4 });

  document.querySelectorAll('.bar-fill').forEach(b => {
    if(belowFold(b)){ b.style.width = '0%'; barIo.observe(b); }
  });

  const navToggle = document.getElementById('navToggle');
  const navLinksEl = document.querySelector('.nav-links');
  navToggle.addEventListener('click', () => {
    const open = navLinksEl.style.display === 'flex';
    navToggle.setAttribute('aria-expanded', String(!open));
    if(open){
      navLinksEl.style.cssText = '';
    } else {
      navLinksEl.style.cssText = 'display:flex; position:fixed; top:72px; left:0; right:0; background:#FFFFFF; flex-direction:column; padding:24px 32px; border-bottom:1px solid #D2D2D7; gap:20px;';
    }
  });
  navLinksEl.addEventListener('click', (e) => {
    if(e.target.tagName === 'A' && window.innerWidth <= 680){
      navLinksEl.style.cssText = '';
      navToggle.setAttribute('aria-expanded', 'false');
    }
  });
}
</script>
