      projects.forEach((q, i) => {
        const y = ROW0 + i * ROWH, on = i === a, hh = PAL[i % PAL.length];
        rrect(c, 22, y, 316, ROWBOX, 12); c.fillStyle = on ? hh + '2B' : 'rgba(255,255,255,.045)'; c.fill();
        c.strokeStyle = on ? hh + 'AA' : 'rgba(255,255,255,.08)'; c.lineWidth = 1; c.stroke();
        c.beginPath(); c.arc(40, y + ROWBOX / 2, 5, 0, 6.3); c.fillStyle = on ? hh : '#3A4055'; if(on){ c.shadowColor = hh; c.shadowBlur = 10; } c.fill(); c.shadowBlur = 0;
        c.fillStyle = on ? '#F4F1EA' : '#A5ABBB'; c.font = `${on ? 600 : 500} 16px ${BODY}`; c.fillText(fitText(c, q.title, 270), 58, y + ROWBOX / 2 + 5.5);
      });
      c.fillStyle = '#8F93A3'; c.font = `500 11px ${MONO}`; c.fillText(`${String(a + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`, 28, PHU - 40);
      rrect(c, 28, PHU - 30, 304, 3, 1.5); c.fillStyle = 'rgba(255,255,255,.1)'; c.fill();
      const bar = c.createLinearGradient(28, 0, 332, 0); bar.addColorStop(0, '#4CC2FF'); bar.addColorStop(1, '#FF7A45'); rrect(c, 28, PHU - 30, 304 * (a + 1) / Math.max(N, 1), 3, 1.5); c.fillStyle = bar; c.fill();
      /* right page: the project */
      c.translate(360, 0);
      c.fillStyle = '#9AA3B8'; c.font = `500 10px ${MONO}`; c.fillText(workTitle.toUpperCase(), 30, 62);
      c.textAlign = 'right'; c.fillStyle = hue; c.fillText(`${String(a + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`, 330, 62); c.textAlign = 'left';
      rrect(c, 30, 92, 84, 84, 22); const tg = c.createLinearGradient(30, 92, 114, 176); tg.addColorStop(0, hue); tg.addColorStop(1, '#0B0F1A'); c.fillStyle = tg; c.fill(); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1; c.stroke();
      const ini = p.title.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || (p.title[0] || '');
      c.fillStyle = '#fff'; c.font = `700 32px ${DISP}`; c.textAlign = 'center'; c.fillText(ini, 72, 146); c.textAlign = 'left';
      let y = 216;
      c.fillStyle = hue; c.font = `500 11px ${MONO}`; for(const l of wrap(c, p.category.toUpperCase(), 300, 2)){ c.fillText(l, 30, y); y += 16; }
      y += 12; c.fillStyle = '#F6F3EC'; c.font = `700 32px ${DISP}`; for(const l of wrap(c, p.title, 300, 3)){ c.fillText(l, 30, y); y += 36; }
      y += 4; c.fillStyle = '#B2AFA8'; c.font = `400 14px ${BODY}`; for(const l of wrap(c, p.role, 300, 2)){ c.fillText(l, 30, y); y += 20; }
      y += 14; let x = 30; c.font = `500 11px ${MONO}`;
      for(const tag of p.tags.slice(0, 5)){ const w = c.measureText(tag).width + 22; if(x + w > 330){ x = 30; y += 30; } rrect(c, x, y - 15, w, 25, 8); c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1; c.stroke(); c.fillStyle = '#D9D6CF'; c.fillText(tag, x + 11, y + 2); x += w + 7; }
      c.restore(); uiTex.needsUpdate = true;
    };

    /* ---- scene graph: root travels between anchors; stage lifts the composition so it is centred ---- */
    const root = new THREE.Group(); scene.add(root);
    const stage = new THREE.Group(); root.add(stage);
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 5.4), lightMat(radial(256, [[0, [110, 190, 255], .26], [.22, [110, 170, 255], .16], [.45, [255, 122, 69], .075], [.68, [255, 122, 69], .03], [.86, [255, 122, 69], .008], [1, [255, 122, 69], 0]])));
    halo.position.set(0, -.1, -1.6); stage.add(halo);
    const duo = new THREE.Group(); stage.add(duo); duo.add(holder);
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(3.7, .95), lightMat(radial(128, [[0, [76, 194, 255], .32], [.5, [76, 194, 255], .1], [1, [76, 194, 255], 0]])));   // kept close under the device so its glow never reaches the heading below
    pool.rotation.x = -Math.PI / 2; pool.position.y = -DEVICE_H / 2 - .08; stage.add(pool);

    /* orbiting tags: glass chips with real depth, so they pass behind the device and in front of it */
    const orbit = new THREE.Group(); orbit.rotation.set(.12, 0, .08); stage.add(orbit);
    const chips = tags.map((label, i) => {
      const f = `500 26px ${MONO}`, m = mk(8, 8).getContext('2d'); m.font = f;
      const w = Math.ceil(m.measureText(label).width) + 46, h = 62, c = mk(w + 24, h + 24), x = c.getContext('2d');
      x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 16; x.shadowOffsetY = 5;
      rrect(x, 12, 10, w, h, 14); x.fillStyle = 'rgba(24,30,44,.92)'; x.fill(); x.shadowBlur = 0; x.shadowOffsetY = 0;
      x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 2; x.stroke();
      x.strokeStyle = '#FF7A45'; x.lineWidth = 3; x.beginPath(); x.moveTo(12, 28); x.lineTo(12, 10); x.lineTo(30, 10); x.stroke();
      x.font = f; x.fillStyle = '#E6E3DC'; x.textBaseline = 'middle'; x.fillText(label, 12 + 23, 10 + h / 2 + 1);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
      sp.material.map.colorSpace = THREE.SRGBColorSpace; sp.scale.set((c.width / c.height) * .23, .23, 1); orbit.add(sp);
      return { sp, a: i * 6.283 / Math.max(tags.length, 1), y: [.9, .05, -.85][i % 3] };
    });

    /* a little dust in the air, fixed to the page rather than to the device */
    const dustN = fine ? 140 : 60, dp = new Float32Array(dustN * 3);
    for(let i = 0; i < dustN; i++) dp.set([(Math.random() - .5) * 14, (Math.random() - .5) * 8, -1 - Math.random() * 3], i * 3);
    const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xFFE6D2, size: .05, transparent: true, opacity: .45, depthWrite: false })); scene.add(dust);

    /* ---- states: where the device sits and what its screen shows in each part of the page ---- */
    const STATES = {
      hero:    { comp: [3.5, 2.5], tags: 1, mode: 0, yaw: -.16, pitch: -.04, fold: 0, yo: .75 },
      work:    { comp: [3.0, 2.2], tags: 0, mode: 1, yaw: -.1, pitch: -.02, fold: -.015, yo: 0 },
      contact: { comp: [3.5, 2.5], tags: 0, mode: 0, yaw: .12, pitch: -.04, fold: .01, yo: 0 },
    };
    const P = { ...STATES.hero };
    let cur = null, vis = 0, dx = 0, dy = 0, ds = 0, rs = 1, W = innerWidth, H = innerHeight, wpp = 1;

    const fit = () => {
      W = innerWidth; H = innerHeight;
      renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
      camera.aspect = W / H; camera.updateProjectionMatrix();
      wpp = 2 * DIST * Math.tan(FOV * Math.PI / 360) / H;
    };
    const targetFor = (k) => {
      const r = A[k] && A[k].getBoundingClientRect();
      if(!r || r.width < 40 || r.height < 40) return null;
      const c = STATES[k].comp;
      return { x: (r.left + r.width / 2 - W / 2) * wpp, y: -(r.top + r.height / 2 - H / 2) * wpp, s: Math.min(r.width * wpp / c[0], r.height * wpp / c[1]) * (k === 'work' ? 1.06 : 1.08), mid: r.top + r.height / 2, h: r.height };
    };
    const pick = () => {
      let best = null, bd = 1e9;
      for(const k of ['hero', 'work', 'contact']){
        const t = targetFor(k); if(!t) continue;
        const dd = Math.abs(t.mid - H / 2);
        if(dd < H / 2 + t.h / 2 && dd < bd){ best = k; bd = dd; }
      }
      return best;
    };

    /* ---- the active project follows the page, a hover, or a tap on the screen ---- */
    const cards = [...document.querySelectorAll('.proj-card')];
    let hoverIdx = -1, pulse = 0;
    const setActive = (i) => {
      if(i === projIdx) return;
      projIdx = i; pulse = 1; uiDirty = true;
      cards.forEach((c, n) => c.classList.toggle('is-active', n === i));
    };
    cards.forEach((c, n) => {
      c.addEventListener('pointerenter', () => { hoverIdx = n; });
      c.addEventListener('pointerleave', () => { if(hoverIdx === n) hoverIdx = -1; });
      c.addEventListener('focus', () => { hoverIdx = n; });
    });
    const nearestCard = () => {
      let best = 0, bd = 1e9;
      cards.forEach((c, n) => { const r = c.getBoundingClientRect(), dd = Math.abs(r.top + r.height / 2 - H * .5); if(dd < bd){ bd = dd; best = n; } });
      return best;
    };

    /* ---- input: parallax, drag, and taps on the project index ---- */
    let tx = 0, ty = 0, px = 0, py = 0, drag = false, dragX = 0, dragY = 0, lx = 0, ly = 0, sxp = 0, syp = 0, moved = 0, releasedAt = 0;
    if(fine && !calm) document.addEventListener('pointermove', (e) => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; }, { passive: true });
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const rowAt = (cx, cy) => {
      if(P.mode < .5) return -1;
      ndc.set(cx / W * 2 - 1, -(cy / H * 2 - 1)); ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObject(inner)[0]; if(!hit || !hit.uv || hit.uv.x > .5) return -1;
      const x = hit.uv.x * 2 * 360, y = hit.uv.y * PHU - ROW0, i = Math.floor(y / ROWH);
      return x > 22 && x < 338 && i >= 0 && i < N && y - i * ROWH <= ROWBOX ? i : -1;
    };
    Object.values(A).forEach(el => {
      if(!el) return;
      el.addEventListener('pointerdown', (e) => { if(calm) return; drag = true; moved = 0; sxp = lx = e.clientX; syp = ly = e.clientY; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', (e) => {
        if(drag){
          dragX = Math.max(-3.3, Math.min(3.3, dragX + (e.clientX - lx) * .008)); dragY = Math.max(-.4, Math.min(.4, dragY + (e.clientY - ly) * .003));
          moved = Math.max(moved, Math.abs(e.clientX - sxp) + Math.abs(e.clientY - syp)); lx = e.clientX; ly = e.clientY;
        }else if(cur === 'work') el.style.cursor = rowAt(e.clientX, e.clientY) >= 0 ? 'pointer' : '';
      });
      const up = (e) => {
        const was = drag; drag = false; releasedAt = performance.now();
        if(was && moved < 6 && cur === 'work'){
          const i = rowAt(e.clientX, e.clientY);
          if(i >= 0 && cards[i]) cards[i].scrollIntoView({ block: 'center', behavior: calm ? 'auto' : 'smooth' });
        }
      };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', () => { drag = false; });
    });

    /* ---- frame ---- */
    const ease = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
    const sstep = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    const t0 = performance.now();
    let prev = t0, blank = false;
    const syncVideo = (o, on) => {
      if(!o || on === o.playing) return; o.playing = on;
      if(on){ if(o.v.preload !== 'auto') o.v.preload = 'auto'; o.v.play().catch(() => {}); } else o.v.pause();
    };
    /* sharpness: when the clip is drawn at less than ~2x its own size (a retina screen) plain linear filtering keeps type crisp;
       mipmaps only take over on small or low-density screens, where plain filtering would shimmer */
    let lastLinear = null, tuneN = 0;
    const tuneFilters = () => {
      if(tuneN++ % 20) return;
      const ratio = TW / (INNER_W * rs / wpp * dpr), linear = ratio < 2.2;
      uniqSets.forEach(S3 => { if(S3.outer && S3.outer.t.minFilter !== THREE.LinearFilter){ S3.outer.t.minFilter = THREE.LinearFilter; S3.outer.t.needsUpdate = true; } });
      if(linear === lastLinear) return; lastLinear = linear;
      [...uniqSets.map(S3 => S3.inner && S3.inner.t), uiTex].forEach(t => { if(!t) return; t.minFilter = linear ? THREE.LinearFilter : THREE.LinearMipmapLinearFilter; t.needsUpdate = true; });
    };
    const frame = (now, snap) => {
      const t = (now - t0) / 1000, dt = Math.min(.05, (now - prev) / 1000); prev = now;
      const kf = snap ? 1 : 1 - Math.exp(-dt * 11), kp = snap ? 1 : 1 - Math.exp(-dt * 5);
      const intro = snap ? 1 : (t - .2) / 2;

      const st = pick();
      const tg = st ? targetFor(st) : null;
      if(st && st !== cur){
        if(cur && vis > .05 && !snap){ dx = root.position.x - tg.x; dy = root.position.y - tg.y; ds = rs - tg.s; } else { dx = dy = ds = 0; }
      }
      cur = st;
      if(tg){
        root.position.set(tg.x + dx, tg.y + dy, 0); rs = tg.s + ds;
        dx *= 1 - kf; dy *= 1 - kf; ds *= 1 - kf;
        const S2 = STATES[st]; for(const k in S2) if(k !== 'comp') P[k] += (S2[k] - P[k]) * kp;
      }
      vis += ((tg ? 1 : 0) - vis) * (snap ? 1 : 1 - Math.exp(-dt * 8));
      root.visible = vis > .01 && rs > .001;
      const m = sstep(.15, .85, P.mode);
      const setName = cur === 'contact' ? 'contact' : 'hero', cur3 = sets[setName];
      const wantInner = root.visible && !calm && m < .6, wantOuter = root.visible && !calm && Math.abs(duo.rotation.y) > 1.2;
      uniqSets.forEach(S3 => { const mine = S3 === cur3; syncVideo(S3.inner, wantInner && mine); syncVideo(S3.outer, wantOuter && mine); });
      if(!root.visible){ if(!blank){ renderer.clear(); blank = true; } return; }
      blank = false;
      root.scale.setScalar(Math.max(.0001, rs * ease(vis)));

      tuneFilters();
      if(N && cur === 'work') setActive(hoverIdx >= 0 ? hoverIdx : nearestCard());
      if(uiDirty && m > .02){ uiDirty = false; drawUI(); }
      pulse *= snap ? 0 : Math.exp(-dt * 7);

      px += (tx - px) * (snap ? 1 : .06); py += (ty - py) * (snap ? 1 : .06);
      if(!drag && (snap || now - releasedAt > 1800)){ const back = Math.abs(dragX) > 1.2 ? .965 : .92; dragX *= snap ? 1 : back; dragY *= snap ? 1 : .92; }   // a turned-around device rests a moment, then eases home
      stage.position.y = P.yo * (W > 960 ? 1 : 0);   // the lift only helps where the Duo sits beside the text; stacked above it, on a tablet or phone, it would run under the header
      duo.rotation.set(P.pitch + py * .12 + dragY, P.yaw + px * .3 + dragX - (1 - ease(intro)) * .5, 0);
      duo.position.y = Math.sin(t * .9) * .035;
      holder.scale.setScalar(k0 * (.95 + .05 * ease(intro)));
      /* the model's own open/close animation, scrubbed: it opens out of a half-fold on load, then breathes a little */
      mixer.setTime(Math.min(1, Math.max(0, P.fold + .03 + .02 * Math.sin(t * .8) + (1 - ease(intro)) * .5)));
      /* the screen: the clip in the hero and at the end, the project browser in the work section; it dips to black between */
      const showUI = m > .5;
      if(outerMat) outerMat.map = cur3.outer && cur3.outer.ready && cur3.outer.playing ? cur3.outer.t : cur3.outerStill;
      const live = cur3.inner && cur3.inner.ready, want = showUI ? uiTex : (live ? cur3.inner.t : cur3.innerStill);
      if(!!want !== !!innerMat.map) innerMat.needsUpdate = true;
      innerMat.map = want;
      innerMat.color.setScalar(showUI || live || cur3.innerStill ? Math.pow(Math.abs(2 * m - 1), .6) : 0);
      halo.material.opacity = vis; pool.material.opacity = vis;
      orbit.visible = P.tags > .02;
      /* the tags orbit wide on a big screen and tighter on a narrow one, so none is ever cut by the edge of the page */
      const cxpx = W / 2 + root.position.x / wpp, rad = Math.min(1.9, Math.max(1.05, (Math.min(cxpx, W - cxpx) - 12) * wpp / rs - .42));
      chips.forEach((c, i) => {
        const a = c.a + t * .32;
        c.sp.position.set(Math.cos(a) * rad, c.y + Math.sin(a * 1.3 + i) * .1, Math.sin(a) * .95);
        /* a tag fades out while it would cross in front of the screen, so it never hides anything on it */
        const px2 = Math.abs(c.sp.position.x), cover = Math.sin(a) > 0 ? sstep(1.75, 1.3, px2) : 0;
        c.sp.material.opacity = P.tags * (1 - cover);
      });
      dust.position.y = scrollY * .0012; dust.rotation.y = Math.sin(t * .05) * .1;
      renderer.render(scene, camera);
    };

    fit();
    let shown = false, raf = 0, last = performance.now(), slow = 0, frames = 0;
    const present = () => {
      if(shown) return; shown = true;
      A.hero.classList.add('gl-on'); document.documentElement.classList.add('stage-on');
      A.hero.setAttribute('role', 'img');
      A.hero.setAttribute('aria-label', 'A foldable iPhone Duo playing a short clip of Piyush Selarka\'s projects and an ARKit session');
    };
    const loop = (now) => {
      raf = requestAnimationFrame(loop);
      frame(now, false); present();
      /* a device that cannot hold ~30 fps drops the resolution once, then settles on a still frame */
      frames++; slow += (now - last > 34) ? 1 : -.25; slow = Math.max(0, slow); last = now;
      if(frames > 90 && slow > 40){
        slow = 0; frames = 0;
        if(dpr > 1){ dpr = 1; fit(); } else { cancelAnimationFrame(raf); raf = 0; calmMode(); }
      }
    };
    const run = () => { if(raf || document.hidden) return; last = performance.now(); prev = last; raf = requestAnimationFrame(loop); };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; };
    /* still mode: redraw only when the page moves or resizes (reduced motion, or a device that is too slow); the screen shows its still */
    let pending = 0, still_ = false;
    const redraw = () => { if(pending) return; pending = requestAnimationFrame((n) => { pending = 0; frame(n, true); present(); }); };
    function calmMode(){ still_ = true; stop(); uniqSets.forEach(S3 => { [S3.inner, S3.outer].forEach(o => { if(o){ syncVideo(o, false); o.ready = false; } }); }); addEventListener('scroll', redraw, { passive: true }); redraw(); }
    if(calm) calmMode(); else run();
    addEventListener('resize', () => { fit(); if(still_) redraw(); });
    document.addEventListener('visibilitychange', () => { if(still_) return; if(document.hidden){ stop(); uniqSets.forEach(S3 => { syncVideo(S3.inner, false); syncVideo(S3.outer, false); }); } else run(); });
  }catch(err){
    A.hero.classList.add('gl-off');
    console.warn('3D stage unavailable, keeping the flat duo', err);
  }
}
